        "content": "صللاة تعويض لإهانات يسوع بالقربان الأقدس (هذه الصلاة تلاها أطفال\nفاتيما مرّات كثيرة) يا الهي، إنّي أؤمن وأعبد وآمل وأحبك!\nأطلب منك السماح، عن الذين لا يؤمنون، ولا يعبدون، ولا\nيأملون، ولا يحبونك. (ثلاث مرات) أيّها الثالوث الكليّ القداسة: آب\nوابن وروح قدس، إنّي أقدّم لك كلّ شيء، وأنا أعبد\nجسد ودم سيدنا يسوع المسيح الثمينَين للغاية، وروحَه وألوهيَّته، يسوع\nالمسيح الموجود في جميع بيوت القربان في العالم، تعويضًا عن\nالإهانات اللاحقة. وإنّي بواسطة إستحقاقات قلبه المقدس اللامتناهيّة، وبشفاعة قلب\nمريم البريء من الدنس، أرجو منك إرتداد الخطأة. (ملاحظة: كان\nالأطفال يتلون هذه الصلاة وهم راكعون على ركبهم وجبهتهم منحنية\nحتى ملامسة الأرض. وكانوا يقولون بأنّ ملاكًا قد علّمهم ﺇيّاها)."
    },
    "20": {
        "title": "✙ صلاة الحماية بسيف مار ميخائيل",
        "lang": "ar",
        "image": "20.jpg",
        "content": "✙ صلاة الحماية بسيف مار ميخائيل\n (من أقوى الصلوات التي\nتُتلى في الأزمنة الصعبة)\n 🕯🗡صلاة الحماية بسيف مار ميخائيل\n (نتلو\nالأبانا ثلاث مرّات)\n أيها القدير جدّاً المُدافع عن شعب اللّه\nضدّ عملاء الشرّ، يا نور الأنوار، درع الإيمان بيسوع المسيح،\nأيّها المجيد، أمير الجيوش السماوية، مار ميخائيل رئيس الملائكة، نور\nالملائكة، لتنزل حمايتُك الآن عليّ بسيفك الكليّ القدرة.\n (صلّوا بصوت\nخفيّ):\nليكن سيف مار ميخائيل حُصني، وحمايتي ودفاعي. بإسم\nالآب والإبن والروح القدس، آميـــــــن.\nاللّه هو الأقوى، لا\nقوّة فوقه، ومار ميخائيل حامل رايته.\n ليكن سيف مار ميخائيل\nفوقي، ليكن أمامي، بيني وبين أعدائي، ليكن خلفي وليحمني من\nهجومات الخائنين الخبثاء الذين يطعنون الظهر .\n يا سيف مار\nميخائيل، كن سندي ودفاعي في المعركة\n يا سيف مار ميخائيل\nأطرُد بعيداً مُضطهد الجنس البشريّ وعملاءه على الأرض الذين قدّموا\nنفسهم للشيطان.\nيا سيف مار ميخائيل، إحفظني يميناً، إحفظني\nشمالاً.\n يا سيف مار ميخائيل إحمني من فخاخ وكمائن أعدائي\nالمنظورين والغير منظورين.\n يا مار ميخائيل، المنفّذ العدالة الإلهية الرهيب،\nلا تسمح لأيّ عميل من تراتبيّة الأشرار بأن يؤذيني بجسدي\nأو خُلُقي أو روحي.\nإنّي أثقُ بقدرة سيفك الذي\nيُنقذ ويحمي.\n يا مار ميخائيل، أشفق عليّ، لا تهملني أبداً،\nلأنّ لك سأدين بخلاص نفسي.\n(نُصلّي ثلاث مرّات السلام\nالملائكيّ)"
    },
    "19": {
        "title": "مسبحة الأحزان والأفراح السبع للقديس يوسف",
        "lang": "ar",
        "image": "19.jpg",
        "content": "باسم الآب والإبن والروح القدس، الإله الواحد. آمين.1- يا عروساً\nكليّ النقاوة لمريم الكليّة القداسة، أيّها القديس المجيد مار يوسف،\nكما أنّ شدّتك وحزن قلبك كانا عظيمين في تردّدك بهجر\nعروسك البريئة من كلّ عيب، هكذا صار فرحك فائق الوصف\nعندما كشف لك الملاك سرّ التجسّد الفائق الإدراك.نطلب إليك بحقّ\nحزنك وفرحك هذين، أن تعزّي نفسنا الآن وعند الأوجاع الأخيرة،\nبفرح حياة بارّة، وموت مقدّس شبيه بموتك بين ذراعَي يسوع\nومريم. (أبانا والسلام والمجد) 2- أيّها القديس المجيد مار يوسف،\nالأب السعيد المنتخب لوظيفة أب مربّ للكلمة المتجسّد، إنّ الحزن\nالذي شعرت به لرؤيتك يسوع الطفل يولد في حالة فقر\nمدقع، قد تحوّل لديك إلى فرح سماوي لدى سماعك ترتيل\nالملائكة ورؤيتك أمجاد ذلك الليل المتلألىء بالأنوار. نتوسل إليك بحزنك\nوفرحك هذين، أن تستمدّ لنا أن نسمع، بعد عبور هذه\nالحياة، تسابيح الملائكة، ونتمتّع بضياء المجد السماوي. (أبانا والسلام والمجد)\n3- أيّها القديس المجيد، المحافظ على الشريعة الإلهية بكلّ تدقيق،\nأنّ الدم الذي هرقه الطفل يسوع في الختانة قد جرح\nقلبك، غير أنّ اسم يسوع عاد فأنعشه مالئاً إيّاه سروراً.\nفبحقّ هذا الألم وهذا الإبتهاج، استمدّ لنا، بعد أن ننقّي\nحياتنا من كلّ رذيلة، أن نلفظ أنفاسنا الأخيرة بفرح، وقلبنا\nوفمنا يتلفّظان باسم يسوع الكليّ القداسة. (أبانا والسلام والمجد) 4-\nأيّها القديس السعيد مار يوسف المجيد، يا من كان لك\nقسط بعمل الفداء: لأن كانت نبوءة سمعان الشيخ عمّا سيحتمله\nيسوع ومريم قد سبّبت لك تباريح الموت، فقد ملأك غبطة\nما تنبأ به أيضاً هذا الشيخ عن خلاص وقيام نفوس\nعديدة مجيدة. فاستمدّ لنا، بواسطة غمّك وسرورك المذكورين، أن نكون\nمن عداد أولئك الذين سيقومون للمجد بواسطة استحقاقات يسوع وشفاعة\nمريم العذراء. (أبانا والسلام والمجد) 5- أيّها القديس المجيد مار\nيوسف، الحارس الساهر والسمير الحميم لابن الله، كم تعبتَ بحملك\nوخدمتك لابن العلي، خصوصاً في الهرب إلى مصر! ولكن كم\nفرحت بأن يكون معك دائماً الله نفسه، وأن ترى أصنام\nمصر تسقط على الأرض عند حضوره! فبحقّ حزنك وفرحك المتقدّمين،\nاستمدّ لنا أن نطرد بعيداً عنّا الظالم الجهنّميّ، خصوصاً بالهرب\nمن الأسباب الخطيرة، وأن يسقط من قلبنا كلّ صنم تعلّق\nأرضيّ، ويتّجه كلّ اهتمامنا إلى خدمة يسوع ومريم، ولا نحيا\nولا نموت إلا لأجلهما فقط. (أبانا والسلام والمجد) 6- يا\nملاك الأرض، يا مار يوسف المجيد، يا من خضع ملك\nالسماوات لأوامرك، لأن كانت تعزيتك في أنّ تُرجع الطفل من\nمصر خالطها الخوف من أركيلاوس، فمع ذلك طمأنك الملاك، وعدت\nفسكنت الناصرة فرحاً، مطمئناً، مع يسوع ومريم. فاسأل لنا، بواسطة\nما انتابك إذّاك من الحزن والفرح، أن يتبدّد عن قلبنا\nكلّ خوف مضرّ، فنتمتّع بسلام الضمير ونعيش آمنين مع يسوع\nومريم، ونموت بين أيديهما أيضاً. (أبانا والسلام والمجد) 7- يا\nمثال كلّ قداسة، مار يوسف المجيد، عندما أضعت الطفل يسوع،\nدون ذنب منك، فقد فتّشت عنه ثلاثة أيّام بحزن شديد\nغلى أن وجدته في الهيكل بين المعلّمين، وتمتّعت به بمسرّة\nعظمى. نبتهل إليك من صميم قلوبنا، بحقّ حزنك هذا وبالفرح\nالذي عقبه، أن تحول دوننا فلا يعرض لنا أبداً أن\nنضيّع يسوع بخطيئة ثقيلة. ولكن لأن خسرناه يوماً، لسوء حظّنا،\nفاجعلنا نطلبه بحزن ولجاجة متّصلين، حتى نجده، ولا سيّما عند\nساعة الموت، فننتقل إلى مشاهدته في السماء حيث نُشيد معك\nبمراحم الله إلى أبد الآبدين. (أبانا والسلام والمجد) – صلِّ\nلأجلنا أيّها القديس يوسف. – لكي نستحق مواعيد المسيح. لنصلِّ:\nأيّها الإله، الذي تنازل بعناية لا توصف، فاختار الطوباوي يوسف\nعروساً لأمّه الكليّة القداسة ، نسألك نحن الذين نكرّم على\nالأرض شفيعنا هذا، أن نستحقّه شفيعاً لنا في السماء، يا\nمن تحيا وتملك إلى دهر الداهرين. آمين"
    },
    "18": {
        "title": "التكرس لقلب مريم الطاهر ، التكرس لقلب يسوع الأقدس ، التكرس لقلب مار يوسف",
        "lang": "ar",
        "image": "18.jpg",
        "content": "(تلاوتها يومياً، مهمّة جدّاً) *فعل التكرس لقلب لمريم الطاهر* :\nيا مريم إمي، إني أختارك اليوم ، في حضرة البلاط\nالسماوي أجمعه، أمٱ لي وملكة علي، وأهب قلبك الطاهر جسدي\nونفسي وقلبي وروحي وخيراتي الداخلية والخارجية، وقيمة أعمالي الحسنة ذاتها،\nالماضية والحاضرة والمستقبلة جميعها و: اكرّسها لكِ بكل تسليم وحب،\nتاركٱ لكِ ملئ الحق بأن تتصرّفي بي وبكل ما يعود\nلي بدون إستثناء وبحسب هواك، لمجد الله، في هذا الزمن\nوفي الأبدية + امين *فعل التكرس لقلب يسوع الاقدس* يا\nقلب سيّدي يسوع المَوجود حَقاً في الإفخارستيا والمَبذول في كُلِّ\nلَحظَة على جَميع مَذابِح العالم: إنّي أهبُكَ نفسي وأكرّس لكَ\nذاتي وحياتي وأعمالي وأحزاني وآلامي، لِأتَّحِد كُليّاً فيك، وكي لا\nيبقى فيّ شيء إلاّ إكرامُكَ وحبّك وتمجيدك، فَأرجوكَ يا يسوع\nإقبَل عَطية ذاتي المُتواضِعة واستعمِلني كما تشاء، لِمَجد الله وخلاص\nالنفوس، وكن أيّها القلب الأقدس مبرّرًا لي عند الآب، وأَبعِد\nعنّي سهام غضَبِك العادل، أستحلفك بأحشاء حبّكَ أن يكونَ إسمي\nمرسومًا فيك، لأنّي أريد أن تكون سعادتي وغبطتي، وأن أحيا\nوأموت في خدمتك يا يسوع + آمين *فعل التكرس لقلب\nمار يوسف* أيّها القدّيس يوسف المجيد، الذي انتخبك الله أبًا\nمربّيًا ليسوع، وعروسًا كلّي الطهارة لمريم العذراء الدائمة ‏بتوليّتها، ورأسًا\nللعائلة المقدّسة، وقد اختارك من ثَمَّ نائبُ المسيح، شفيعًا ومحاميًا\nسماويًّا للكنيسة التي ‏أسّسها المسيح.‏ فأنا بملء الثقة، أسأل الآن\nعضدك للكنيسة المحاربة: فبحبّك الأبويّ، احمِ بنوع خاص الحبر الأعظم\n‏وجميع الأساقفة والكهنة المتّحدين مع كرسي بطرس. كن مدافعًا عن\nكلّ الذين يجاهدون في سبيل النفوس بين ضيقات هذه الحياة،\nواجعل شعوب الأرض كلّها تؤيّد الكنيسة التي جعلتها، سرّ الخلاص\nلجميع البشر.‏ تنازل أيضًا، أيّها القدّيس يوسف الجزيل المعزّة، واقبل\nهذه التّقدمة التي أجود لك بها بذاتي. فإنّي ‏أكرّس لك\nذاتي بكلّيتها، حتّى تكون لي على الدوام أبًا، وشفيعًا، وقائدًا\nفي طريق الخلاص. استمدّ لي نقاوة ‏القلب، وحبًّا حارًّا للحياة\nالروحيّة.‏ واجعل كلّ أعمالي تتّجه، على مثالك، إلى مجد الله\nالأعظم، متّحدة مع قلب يسوع الإلهيّ وقلب مريم ‏البريء من\nكلّ عيب، ومعك. وفي الختام صلّي لأجلي، ليمكنني أن أشترك\nفي السلام والفرح اللذين تمتّعت أنت بهما عند ساعة موتك\n‏المقدّس. آمين. ‏ ( *٧ أبانا،٧ السلام، و٧ المجد* )\n*صلاة الحماية للدم الثمين:* أُسكُب علينا دمَكَ الثمين أيها الرب\nيسوع + فيقوّينا + ويحرّرنا + ويحمينا + ويشفينا +\nويقدّسنا + أَغرِق به في وطنِنا وفي كل مكان: -\nالسحرة والأرواح الشرّيرة ، لشلِّهم + - وأعدائَنا المنظورين وغير\nالمنظورين، لتقييدِهم + - والشياطين وأعوانهم وأعمالهم، لسحقِهم + أيها\nالدم الثمين ليسوع المسيح + بشفاعة قلب مريم المتألّم الطاهر\n+ خلِّصنا وخلِّص العالم أجمع + *صلاة الحماية لمار ميخائيل:*\nأيها القديس ميخائيل رئيس الملائكة، دافع عنا في المعركة و\nكن عوننا ضد شرور الشيطان و فخاخه، نصلي باتضاع لكي\nيقهره الله. وأنت يا قائد جند السماء، ادفع الى الجحيم\nبقوة الله، الشيطان وسائر الأرواح الشريرة التي تجوب العالم لإهلاك\nالنفوس. *صلاة ثوب الكرمل للعذراء مريم* أيتها العذراء المقدّسة الخالية\nمن كلّ دنس، يا زينة وجمال جبل الكرمل، أنت التي\nمنحت حنانك المميّز الى كلّ من ارتدى ثوبك المبارك، انظري\nبمحبّة إليّ وغطّني بغطاءٍ من الحماية الأموميّة. قوّي نقاط ضعفي\nبمقدرتك الكبيرة، وأنيري ظلام فهمي بالحكمة، زيدي الإيمان والأمل والخير\nفي داخلي، زيّني روحي بالنِعم الإلهية والفضائل التي ستجعلني مقبولاً\nوموضع سرور لك ولابنك السماويّ. ساعديني خلال أيّام حياتي، وعزّيني\nفي ساعة موتي وقدّميني الى الثالوث الأكثر قداسة كخادمة مكرّسة\nله. لنمجّد ونبارك الربّ في السماء الى الأبد. آمين. (\n*٧ أبانا،٧ السلام، و٧ المجد* ) *صلاة إلى الملاك الحارس*\nيسوع، انت كشفت لنا عن هذا السر. اشكرك من كل\nقلبي على هذه النعمة الكبيرة. كم يجب ان تكون روحي\nقيمة بالنسبة لك لكي تبعث لي بالملاك الحارس حتى يحميني\nويكتب عملي في كتاب الحياة. انت يا ملاكي، الذي لم\nارك بعد، والذي وجودك بجانبي يسعدني، دعني أصبح صديقك! اشكرك\nلأنك دوما وفيا الى الله ولم تتبع الشيطان. اشكرك لأنك\nقبلت بي انا الخاطئ. هل ان معرض لخطر أن أكون\nغير وفي لربي؟ أنا اختارك كحارس لي وقائدي. واعدك بان\nأكون وفيا لك ومطيعا لربنا. أسألك ان تعلمني إذا أخطأت\nتجاه ربي. يا ملاكي الحارس لا تحرسني فقط بل كن\nلي صديق ورافقني! ساعدني كي احافظ على اتحادي مع الله\nالذي بدا يوم عمادي! رافقني حتى لا أخطأ مع أحد\nما. واجعلني لا اعطي أهمية للأشياء المادية بل اتخطاها إلى\nما هو أسمى. ادعم قلبي النقي، حتى أتمكن من النظر\nالى الله وعظمته معك ومع الملائكة والقديسين. آمين"
    },
    "17": {
        "title": "مسبحة وجه يسوع الاقدس",
        "lang": "ar",

        "content": "*عبادة تعويضية من أجل الإنتصار (ليسوع ومريم)* ما هي عبادة\nوجه يسوع الأقدس – كيف نتلو المسبحة والطلبة الخاصة بها\nوصلاة السهم الذهبي التعويضية لا أحد يمنحني قبلة حبّ على\nوجهي ليعوّض عن قبلة يهوذا. يعود أصل عبادة وجه يسوع\nالأقدس الى عام 1844 التي نشأت من خلال راهبة كرملية\nاسمها ماري للقديس بطرس، في فرنسا. التي أعلنت أن الرب\nيسوع كشف لها عن رغبته بهذه العبادة على جبل الكرمل.\nوقال لها أنه يرغب أن تنتشر هذه العبادة في العالم\nأجمع بهدف التعويض عن الإهانات اللاحقة به. عندما سمع رجل\nاسمه ليو دوبونت عن هذه العبادة، بدأ يمارسها سراً في\nمنزله القريب من الدير. وبدأت تتكرّر المعجزات لفترة تزيد عن\nالثلاثين سنة! انتشر الخبر وأصبحت العبادة على الفور حديث فرنسا،\nوجذبت انتباه الكنيسة الكاثوليكية، التي حققت واعترفت علناً بأصالة المعجزات\nوبصحة الظهورات. في 1885، ولنشر الاهتمام بهذه العبادة، شجّع البابا\nلاون الثالث عشر هذه العبادة وأمر بنشرها في العالم أجمع.\nوقد منح العديد من الباباوات غفرانات مختلفة لممارسي هذه العبادة.\nمنهم البابا بيوس التاسع، وليون الثالث عشر. وفي عام 1919\nظهر الرب يسوع يعلو الحزن على وجهه المغطّى بالدماء للطوباوية\nماريا بيارينا دي ميشالي بينما كانت تشكو له عن أحزانها\nوقال لها: “وأنا، ماذا فعلت؟” ومن حينها تتالت لها ظهوراته\nوأعلن لها عن رغبته بنشر العبادة من جديد، وأصبحت ماريا\nرسولة الوجه الأقدس. من أقواله لها: – أرغبُ أن يُكرّم\nوجهي في عيد خاص يوم الثلاثاء، من الأسبوع الأول من\nالصوم. – لا أحد يمنحني قبلة حبّ على وجهي ليعوّض\nعن قبلة يهوذا. – لقد قدّمتُ قلبي تعبيراً عن حُبّي\nالعظيم للبشر وأُقدّم وجهي كشيء حسّي لحُزني على خطايا البشر\nكلّها. من المعروف أن القديسة تريزيا الطفل يسوع كانت من\nأشد المتعبّدين للوجه الأقدس الأمر الذي جعلها تتّخذ اسم تريزيا\nللطفل يسوع والوجه الأقدس”. كانت هذه العبادة تُمارس في جميع\nالبلاد المسيحية قبل الحرب العالمية الأولى، لكن للأسف أصبحت منذ\nذلك الحين نادراً ما تُعرف. سنة 1958 أعلن البابا بيوس\n12 رسمياً لجميع المؤمنين الكاثوليك الاحتفال بعيد وجه يسوع الاقدس\nفي أول ثلاثاء من الصوم. من الجدير بالذكر أن الرب\nيسوع أعطى وعوداً تخص مباشري هذه العبادة سيتم نشرها في\nموعد لاحق. فيما يلي مسبحة الوجه الأقدس والطلبة: مسبحة وجه\nيسوع الأقدس تتلى 5 أبيات على حبات مسبحة الوردية صلاة\nالبداية يا أيها الوجه المقدس، إننا نطلبك حتى تستجيب لصلواتنا.\nأنت قادر على مساعدتنا بطريقة عجيبة، أيها الإله القدوس، الإله\nالقوي، الإله الذي لا يموت، إرحمنا وارحم العالم أجمع. أدِر\nوجهك نحونا حتى ننال الخلاص. على الحبات الكبيرة بدل الأبانا\nيتلى قبل كل بيت: – أيها الآب الأزلي إننا نقدّم\nلك بتواضع وحرارة الإستحقاقات اللامتناهية وعذابات الوجه المقدس، دمعه الثمين،\nوكل جراحات ودموع يسوع لمجدك ولمعونتنا في حاجاتنا المُلّحة. البيت\nالأول: أيها الوجه المقدس المغطى بالجروح، إرحمنا نحن المستغيثين بك.(10\nمرات) البيت الثاني: أيها الوجه المقدس المغطى بالدماء، إرحمنا نحن\nالمستغيثين بك.(10 مرات) البيت الثالث: أيها الوجه المقدس الذي يذرف\nدموع الحب اللامتناهي، إرحمنا نحن المستغيثين بك.(10 مرات) البيت الرابع:\nأيها الوجه المقدس المحتقر والمُهان، إرحمنا نحن المستغيثين بك.(10 مرات)\nالبيت الخامس: أيها الوجه المقدس الذي يتحمّل أشدّ الآلام بصمت،\nإرحمنا نحن المستغيثين بك.(10 مرات) صلاة الختام: هلمّوا نعبد وجه\nربنا ومخلصنا يسوع المسيح الأقدس الذي استحقاقاته لامتناهية ورحمته لا\nتقاس، ليمنحنا غفراناً لخطايانا وندامة حقيقية. هلّموا نواسي الوجه الأقدس\nبنقاوة سيرتنا، بالشهادة لإيماننا دون خوف، وبعمق حبّنا. آمين .\nطلبة وجه يسوع الأقدس كيرياليسون، كريستياليسون، كيرياليسون. يا ربَّنا يسوع\nالمسيح أنصت إلينا يا ربَّنا يسوع المسيح إستجبنا أيُّها الآب\nالسماويّ اللّٰه إرحمنا يا ابن اللّٰه مخلّص العالم إرحمنا أيّها\nالروح القدس اللّٰه إرحمنا أيُّها الثالوث القدّوس الإله الواحد إرحمنا\nأيُّها الوجه المعبود سرور الآب – إرحمنا أيُّها الوجه المعبود\nأعجوبة الفردوس – إرحمنا أيُّها الوجه المعبود فرح الملائكة –\nإرحمنا أيُّها الوجه المعبود الإغاثة العذبة للقدّيسين – إرحمنا أيُّها\nالوجه المعبود ملجأ ومعزّي الخطأة – إرحمنا أيُّها الوجه المعبود\nرجاء المنازعين – إرحمنا أيُّها الوجه المعبود مرعب وهازم الشياطين\n– إرحمنا أيُّها الوجه المعبود المعبّر عن وصيّة المحبة –\nإرحمنا أيُّها الوجه المعبود المتعطّش إلى خلاص البشر – إرحمنا\nأيُّها الوجه المعبود الّذي ذرف دموع الحبّ – إرحمنا أيُّها\nالوجه المعبود المغطَّى بالبصاق لأجلنا – إرحمنا أيُّها الوجه المعبود\nالّذي عرق دماً – إرحمنا أيُّها الوجه المعبود الّذي أُهين\nوصُفع لأجلنا – إرحمنا أيُّها الوجه المعبود المُعامَل على أنَّه\nلعبد مجرم – إرحمنا أيُّها الوجه المعبود المنحني إلى الأرض\nفي بستان الزيتون – إرحمنا أيُّها الوجه المعبود الّذي إحتقر\nفي المحاكم – إرحمنا أيُّها الوجه المعبود الصّامت خلال الأحكام\nالظالمة – إرحمنا أيُّها الوجه المعبود الّذي مسحته فيرونيكا التقيَّة\n– إرحمنا أيُّها الوجه المعبود الّذي سُقيَ خلاً ومراً –\nإرحمنا أيُّها الوجه المعبود الّذي تشوَّه خلال النزاع القاسي –\nإرحمنا أيُّها الوجه المعبود المصلّي لأجل الصّالبين – إرحمنا أيُّها\nالوجه المعبود الشاحب من الألم – إرحمنا أيُّها الوجه المعبود\nالّذي بكته أمُّ الأوجاع مريم – إرحمنا أيُّها الوجه المعبود\nالمغطّى خلال دفنه – إرحمنا أيُّها الوجه المعبود المطبوع على\nالكفن – إرحمنا أيُّها الوجه المعبود المشعّ بالمجد خلال قيامته\n– إرحمنا أيُّها الوجه المعبود المستنير والممجّد خلال الصّعود –\nإرحمنا أيُّها الوجه المعبود المُحتجب بتواضع عميق في سرّ الإفخارستيَّا\n– إرحمنا أيُّها الوجه المعبود الظاهر بقدرة وجلال عظيم في\nآخر الأزمنة – إرحمنا أيُّها الوجه المعبود صورة الآب الأزليّ\n– إرحمنا يا حمل الله الحامل خطايا العالم أنصت إلينا\nيا حمل الله الحامل خطايا العالم إستجبنا يا حمل الله\nالحامل خطايا العالم إرحمنــا كرياليسون، كريستاليسون، كرياليسون. صلاة السهم الذهبي:\nفليُمدح ويُسجد له وليُحبّ ويُعبد ويُمجّد إسمُ الله الكليّ القداسة\nمن جميع الخلائق التي تعيشُ في السماء وعلى الأرض و\nتحت الأرض. فليُمدح خاصةً ويُعبد إسمُ يسوع الإلهي الحاضر في\nجميع بيوت القربان وليُمجّد قلبُه الأقدس وقلبُ مريم الطاهر. يا\nيسوع أودُّ أن يكون عطشُك الدائم إلى النفوس مرتوياً دائماً،\nوأطلبُ بأن تُحبّك قلوبُ البشر كلّها وتعزّيك باستمرار. آمين السّهم\nالذهبي للتعويض عن التجاديف على اسم يسوع القدّوس كتبت الأخت\nماري دي سان بيار، كرمليّة من فرنسا متوفاة سنة 1848\nكشف لي سيّدنا يسوع المسيح عن قلبه، وسمعت هذه الكلمات:\n“إن اسمي مُجَدّف عليه في كلّ مكان، حتّى الأطفال يُجدّفون”.\nفأعلَمني حينئذٍ مقدار ما تجرح قلبه الإلهيّ بألم هذه الخطيئة\nالمرعبة أكثر من سواها من الخطايا. فبالتجديف يلعنه الخاطئ وجهًا\nلوجه، ويهاجمه علانية، ويلاشي سرّ الفداء، ويلفظ هو بنفسه حكم\nإعدامه ودينونته. إنّ التجديف هو كسهمٍ مسمّم يجرح قلبه باستمرار.\nثمّ قال لي بأنّه يريد أن يعطيني سهمًا لأجرحَه بعذوبة،\nوأُضمّد جراحات الخبث التي يسبّبها له الخطأة. إليكم عبارة المديح\nالتي أملاها عليّ، بالرغم من عدم استحقاقي الكبير، للتعويض عن\nالتجاديف على اسمه القدّوس، وقد أعطاني إيّاها كسهم ذهبيّ، مؤكّدًا\nلي أنّني، في كلّ مرّة أتلوها، أجرح قلبه بجرح حبّ.\nثمّ أضاف قائلاً: “انتبهي إلى هذه الهبة، فسوف أطالبك بالحساب\nعنها”. ففي اللحظة عينها، كان يخال لي أنّني أرى سيولاً\nمن النعم تخرج من قلب يسوع الأقدس، المجروح بهذا السهم\nالذهبيّ، لأجل ارتداد الخطأة. فعل مديح – السّهم الذهبي فليُمدَح\nدائمًا، ويُبارك، ويُحبّ، ويُعبد، ويمجَّد اسم الله الكليّ القداسة، الكليّ\nالعبادة، المجهول للغاية والفائق الوصف، في السماء وعلى الأرض وفي\nالجحيم، من كافّة الخلائق التي خرجت من يد الله، ومن\nقلب سيّدنا يسوع المسيح الأقدس في سرّ القربان الفائق القداسة.\nآمين علينا أن نكون أنفس مقدسة ومضحية ، ندافع عن\nإسم المسيح القدوس ، ونعيش التكفير التعويضي (عن آلام وجراح\nالمسيح وآلام وجراح وجهه الأقدس والخطايا ضد قلب يسوع الاقدس\nوالإهانات صد قلب مريم الطاهر) لخلاص النفوس ومجد المسيح الملك\nالله. وللتعويض عن مخالفة الوصايا الثلاث الاولى : - نعبد\nالله وحده - لا نحلف باسم الرب - نحفظ يوم\nالرب وهي عبادة تنصرنا على الشيوعية العالمية والثوار ضد الكنيسة\nوالله (مخطط إبليس) وترد كثير من النفوس."

إجعلي قلبنا مشابهًا لقلب يسوع أيّها الآب الكلّي الصلاح، يا\nمن ملأ قلب الطوباويّة مريم بعواطف الرحمة والمحبّة التي تملأ\nقلب مخلّصنا الحبيب، هَب لجميع الذين يكرّمون هذا القلب الطاهر،\nأن يثبتوا حتّى الممات على مماثلة عواطف قلب يسوع المسيح،\nابنك الوحيد، الذي يحيا ويملك معك ومع الروح القدس إلى\nدهر الداهرين. آمين."

        "content": "مسبحة أوجاع العذراء الكلية القداسة السبعة I- الوعود «أيُّ شيءٍ\nيفيدنا أكثر من تعزية أمّنا الحبيبة، عندما يتسنّى لنا دقيقتَين\nإستراحة أو ثلاثة خلال النّهار؟ فلا ننسَ آلام العذراء أبدًا!\nوعند ساعة موتنا ستعزيّنا هي وتساعدنا. نعم! ستُظهِر نفسها لنا،\nوتُبعِد عنّا عذابات الموت، إذا كان ذلك موافِقًا خير نفسنا».\n(القديس غابريال لسيدة الأوجاع) «إنَّ مخلّصنا يسوع أوحى للقديسة فيرونيكا\nالبيناسكيّة، قائلاً لها: «إعلمي يا ابنتي أنّه مقبولٌ لديَّ جدًّا\nذرف الدموع من عبيدي حين تأمّلهم آلامي. ولكنّي لأجل حبّي\nلوالدتي حبًّا لا حدَّ له، فأكثر قبولاً لديَّ هو التأمّل\nفي أحزانها وأوجاعها التي احتملتها حين موتي، من تذكّر آلامي\nأنا عينها». والعذراء أمّ الفداء، أوصَت القديسة ماتيلدا قائلةً: «طوبى\nللّذين يتلون يومياً فرض أحزاني وطلبتها، ويذرفون الدموع السّخية على\nآلامي القاسية، وأوجاعي الموجِعة، فأستمدّ لهم حياةً بارّةً، وميتةً صالحةً،\nوعند ساعة موتهم أحتضنُهم بين ذراعيَّ. فالذين يَنشرون ويذيعون هذه\nالعبادة الخلاصيّة ويكثرون طَبعها، أُبارِك مشاريعهم الرّوحية والماديّة، وأُبعِد عنهم\nالمصاعب والضّيقات، وأشملهم بحِمايتي في الحياة والمَمات، ويكون لهم الحظّ\nالأكبَر في السماء».» وعود العذراء مريم إلى القديسة برجيتا السويديّة\nللّذين يلتزمون بتلاوة هذه العبادة التقويّة يوميًّا: 1- سأَهَبُ عائلاتهم\nالسّلام. 2- سَينالون أنوارًا حول الأسرار الإلهيّة. 3- سأعزّيهم في\nأحزانهم، وأرافقهم في أعمالهم. 4- سوف أعطيهم كلّ ما يطلبونه،\nما دام لا يتعارض مع مشيئة الله القدّوسة، أو مع\nخلاص نفوسهم. 5- سأدافع عنهم في معاركهم الروحيّة ضدّ الأعداء\nالجهنميّين، وأحميهم في كلّ لحظةٍ من حياتهم. 6- سأغيثهم بشكلٍ\nمنظورٍ في لحظة موتهم- سيرون وجه أمّهم. 7- لقد حصلتُ\nمن ابني الإلهيّ على هذه النعمة؛ أنَّ الذين ينشرون هذه\nالعبادة سيُؤخذون مباشرةً من هذه الحياة الأرضيّة نحو السعادة الأبديّة،\nإذ أنَّ خطاياهم كلّها ستُغفَر، وسيكون ابني تعزيتهم وسعادتهم الأبديَّتَين.\n(المصدر: هذا هو ابنكِ، سيرة القديس غابريال لسيّدة الأوجاع) II-\nمسبحة أوجاع مريم السّبعة بها نتأمّل آلام قلب مريم الطاهر\nونشاركها إيّاها، طالبين منها الفضائل الإلهيّة السّبع، ومواهب الروح القدس\nالسّبع. طلبت العذراء بإلحاحٍ هذه المسبحة، بجانب مسبحة الورديّة، في\nظهورها في كيبيهو- أفريقيا، 1982 (المثبّت كنسيًا)، كعلاجٍ لمرض العصر،\nالذي هو عدم الشعور بالخطيئة، قائلةً: «إنّ ما أطلبه هو\nالتوبة. إذا صلّيتم هذه المسبحة، متأمّلين في كلّ بيتٍ منها،\nتحصلون على القوّة اللّازمة للتوبة. أناسٌ كثيرون لا يطلبون السماح،\nويضعون يسوع على الصّليب من جديد». _____________________ أوّلاً؛ فعل الندامة:\nيا ربّي وإلهي، أنا نادمٌ من كلّ قلبي على جميع\nخطاياي، لأنّي بالخطيئة خسرتُ نفسي والخيرات الأبديّة، واستحققتُ العذابات الجهنميّة.\nوبالأكثر أنا نادمٌ، لأنّي أغظتكَ وأهنتكَ، أنتَ يا ربّي وإلهي\nالمستحقّ كلّ كرامة ومحبة. ولهذا السّبب، أبغضُ الخطيئة فوق كلّ\nشرّ. وأريد بنعمتك أن أموت، قبل أن أغيظك فيما بعد.\nوأقصد أن أهرب من كلّ سبب خطيئة، وأن أفي بقدر\nاستطاعتي عن الخطايا التي فعلتها. آمين. ثانيًا؛ «يا إلهي، إنّي\nأقدّم لعظمتك، مسبحة الأوجاع هذه المختصّة بأحزان والدتك الكليّة القداسة،\nإنّي أريد التأمّل والمشاركة بعذابها. إنّي أتوسّل إليكَ، بحقّ الدموع\nالتي ذَرَفتها في تلك اللّحظات: أعطِني أنا الخاطئ، كما ولكلّ\nالخطأة، الندامة الكاملة على خطايانا». (٣ مرّات) يقال في كلّ\nبيت من الأبيات السّبعة: مرّة واحدة «الأبانا» ٧ مرّات «السلام\nعليكِ» ويُختَم كلّ بيت بالنافذة التالية: «أيّتها الأم الكليّة الرحمة:\nإجعلي جراحات وحيدكِ في قلبي منطبعة». –البيت الأوّل: إنّي أشارككِ\nيا مريم الوجيعة، في الحزن الذي قاساه قلبكِ الحنون، عند\nنبوءة سمعان الشيخ بأنّ سيفًا من الآلام سيخترق قلبكِ. فيا\nأيّتها الأمّ الحبيبة بحقّ قلبكِ المتألّم، إستمدّي لي فضيلة التواضع،\nومَوهبة مخافة الله. –البيت الثاني: إنّي أشارككِ يا مريم الوجيعة،\nفي الضّيق الذي قاساه قلبكِ الكُليّ الشعور والتأثّر في هربكِ\nوإقامتكِ في مصر. فيا أيّتها الأمّ الحبيبة، بحقّ قلبكِ المُضايَق،\nإستمدّي لي فضيلة السّخاء -لا سيّما نحو الفقراء- وموهبة التقوى.\n–البيت الثالث: إنّي أُشارككِ يا مريم الوجيعة، في الغموم التي\nشعر بها قلبكِ الوالديّ، عند فقدانكِ يسوعكِ الحبيب ثلاثة أيّام.\nفيا أيّتها الأمّ الحبيبة، بحقّ قلبكِ المُضطرب، إستمدّي لي فضيلة\nالطّهارة، وموهبة العِلم. –البيت الرابع: إنّي أشترك معكِ يا مريم\nالوجيعة، في الرُّعب الذي أحسّ به قلبكِ الوالديّ في التقائكِ\nبيسوع حاملًا الصليب. فيا أيّتها الأمّ العزيزة، بحقِّ قلبكِ المُعذّب،\nإستمدّي لي فضيلة الصَّبر، ومَوهبة القوّة. –البيت الخامس: إنّي أقاسمكِ\nيا مريم الوجيعة، الاستشهاد الذي احتمله قلبكِ الشجاع في وقوفكِ\nعند يسوع منازعًا ومائتًا على الصّليب. فيا أيّتها الأمّ العزيزة،\nبحقّ قلبكِ المُستشهِد، أُطلبي لي فضيلة القناعة، ومَوهبة المشورة. –\nالبيت السادس: إنّي أشاطركِ يا مريم الوجيعة، ذاك الجرح الذي\nجرح قلبكِ الحنون، عندما اخترقَت الحربة جنب يسوع وجَرحت قلبه\nالكلّي الحبّ. فيا أيّتها الأمّ المحبوبة، بحقّ قلبكِ المجروح، إستمدّي\nلي فضيلة المحبّة الأخويّة، ومَوهبة الفَهم. -البيت السابع: إنّي أتألّم\nلألمكِ يا مريم الوجيعة، في ذاك النزاع الذي ألمّ بقلبكِ\nالكليّ المحبّة، عند دفن يسوع. فيا أيّتها الأمّ الحبيبة، بحقّ\nقلبكِ الحزين والوحيد للغاية، إستَميحي لي فضيلة النّشاط، وموهبة الحِكمة.\nوفي النهاية: نتلو ٣ مرّات الأبانا والسلام، إكرامًا للعذراء مريم\nالأمّ الحزينة. -يا أمّ المصلوب إرحمينا، وبآلامكِ أَشْركينا، وفي جراح\nيسوع إخفينا، ومن دمه الزكيّ أَسقينا، في نار حبّه أَضرمينا،\nوفي مجد السماء مَتّعينا. -صلّي لأجلنا أيّتها البتول الكليّة الأوجاع،\n-لكي نستحقّ مواعيد المسيح. نتوسّل إليكَ، أيّها الرّب يسوع، أن\nتشفع بنا الآن وفي ساعة موتنا، أمّك الطوباويّة مريم العذراء\nالتي غاص في نفسها المقدّسة سيف الألم، لدى ساعة موتِكَ،\nأنتَ يا من تحيا وتملكُ إلى الأبد، آمين."

        "title": "مسبحة القديس ميخائيل والملائكة القديسين",
        "lang": "ar",
        "image": "4.jpg",
        "content": "في القرن الثامن عشر، كانت الكنيسة تمر بأوقات صعبة وحرجة،\nفظهر عام 1751 رئيس الملائكة القديس ميخائيل المحامي عن الكنيسة\nلخادمة الله المتعبدة له “انطونيا داستوناك” الراهبة الكرمليّة وأعطاها هذه\nالمسبحة المقدّسة وألهمها الصّلوات اللّازمة قبل كل بيت، ووعدها بأن\nكلّ من يكرمه بهذه الطريقة يكون مصحوبًا إلى المائدة المقدسة\n(المناولة) مع ملاك من كل جوقة من أجواق الملائكة التسع\n، وأنّه من يتلو هذه المسبحة يوميًا سيرافقه الملائكة القديسين\nفي حياته، وينّجيه بعد الموت مع أهله من عذابات المطهر\n. تتألف “مسبحة القديس ميخائيل والملائكة القديسين” من تسع ابيات،\nكل بيت مرّة ابانا وثلاث مرات السلام عليك. عام 1871،\nوافق عليها رسميًا قداسة البابا الطوباوي بيوس التاسع !فعل الندامة\n: يا ربي وإلهي، أنا نادمٌ من كلّ قلبي، على\nجميع خطاياي، لأنّي بالخطيئة خسرتُ نفسي والخيرات الأبدية، واستحققت العذابات\nالجهنّمية. وبالأكثر أنا نادم، لأنّي أغظتك وأهنتك، أنت يا ربي\nوإلهي المستحق كلَّ كرامة ومحبّة. ولهذا السّبب أُبغِضُ الخطيئةَ فوق\nكلِّ شرّ. وأُريدُ بنعمَتِك أَن أَموتَ، قبل أَن أغيظَك فيما\nبعد. وأَقصدُ أن أهرب من كلّ سببِ خطيئة، وأن أَفي\n، بقدرِ استطاعتي ، عنِ الخطايا التي فعلتها. آمين. يا\nقدّيس ميخائيل دافع عنّا في المعركة لكي لا نهلك في\nيوم الدينونة . – اللهم أصغِ إلى معونتي – يا\nرب أسرع إلى إغاثتي المجد للآب والإبن والروح القدس الإله\nالواحد . آمين. الى الجوقة الأولى من الملائكة: بشفاعة القديس\nميخائيل والملائكة الساروفيم الملتهبين بنار الحب الإلهي، إجعلنا يا ربّ\nأهلاً لأن نشتعل بمحبة كاملة. آمين . ( مرة أبانا\nوثلاث مرات السلام ) الى الجوقة الثانية من الملائكة:بشفاعة القديس\nميخائيل والملائكة الكاروبيم ذَوي النور والمعرفة، أعِطنا يا ربّ نعمة\nلكي نترك طريق الخطيئة ونسرع في طريق الكمال المسيحي. آمين\n. (مرة أبانا وثلاث مرات السلام ) الى الجوقة الثالثة\nمن الملائكة: بشفاعة القديس ميخائيل والملائكة العروش الجالس عليهم العليّ\nالكلي القدرة، أغمر قلوبنا يا رب بروح التواضع الحقيقي .\nآمين. ( مرة أبانا وثلاث مرات السلام ) الى الجوقة\nالرابعة من الملائكة: بشفاعة القديس ميخائيل والملائكة السيادات ، إمنحنا\nيا ربّ نعمة السيادة على حواسنا والقوة على قمع شهواتنا\nالسيئة. آمين. ( مرة أبانا وثلاث مرات السلام ) الى\nالجوقة الخامسة من الملائكة: بشفاعة القديس ميخائيل والقوات السماويين، تنازل\nيا ربّ واحمِ نفوسنا من أفخاخ الشيطان وتجاربه . آمين\n. ( مرة أبانا وثلاث مرات السلام ) الى الجوقة\nالسادسة من الملائكة: بشفاعة القديس ميخائيل والملائكة السلاطين القاهرين، لا\nتدعنا يا ربّ نرزح تحت التجارب المُهلكة بل نجّنا من\nالشرير. آمين . ( مرة أبانا وثلاث مرات السلام )\nالى الجوقة السابعة من الملائكة: بشفاعة القديس ميخائيل والملائكة الأرباب\nالساهرين على الممالك والأقاليم، إملأ يا ربّ نفوسنا بروح الطاعة\nالحقيقية. آمين . ( مرة أبانا وثلاث مرات السلام )\nالى الجوقة الثامنة من الملائكة: بشفاعة القديس ميخائيل والملائكة الرؤساء،\nإمنحنا يا ربّ نعمة الثبات في الإيمان والقيام بالأعمال الصالحة\nكي نصل إلى مجد السماء. آمين . (مرة أبانا وثلاث\nمرات السلام) الى الجوقة التاسعة من الملائكة: بشفاعة القديس ميخائيل\nوالملائكة القديسين الملتهبين غيرة على خلاصنا، تنازل يا ربّ وأرسل\nهذه الملائكة ليحرسونا في هذه الحياة الفانية ويقودونا في الآخرة\nإلى المجد الخالد في السماء. آمين . ( مرة أبانا\nوثلاث مرات السلام ) في النهاية نُصلّي: – أبانا إكراماً\nللقديس ميخائيل – أبانا إكراماً للقديس جبرائيل – أبانا إكراماً\nللقديس رافائيل – أبانا إكراماً لملاكنا الحارس صلاة : أيّها\nالأمير المُمجّد ” القديس ميخائيل ” رئيس وقائد الجيوش السماوية،\nحارس النفوس، المُنتصر على الأرواح المتمردة، أمير البلاط السماوي وقائدنا\nالمحبوب بعد الرب يسوع المسيح وأمه العذراء مريم سلطانة السماء\nوالأرض، تنازل وابعد عنّا كل المضايقات واجعلنا بشفاعتك التي لا\nمثيل لها نخدم الرب بأمانة أكثر يوماً بعد يوم .\nآمين. صلِّ لأجلنا يا قديس ميخائيل الممجّد، سيد كنيسة يسوع\nالمسيح ، لكي نكون أهلاً لمواعيده. آمين . † ♥\n†"

        "content": "تعال أيّها الروح القدس، تعال بالشفاعة القادرة لقلب مريم البريء\nمن الدنس عروستك المحبوبة جدًا. (صلاة طلبتها العذراء قبل كل\nصلاة) 1- تقدمة الذات للروح القدس : يا روح الله،\nإنّنا نقدّم لك ذواتنا وصلواتنا مع صلاة مريم العذراء والرسل\nالمجتمعين في العلّية طالبين منك أن تأتي وتجدّدنا وتجدّد وجه\nالأرض. – هلمَّ أيها الروح القدس، وأرسل من السماء شعاع\nنورك. هلمَّ يا أبا المساكين. هلمَّ يا مُعطي المواهب. هلمَّ\nيا ضياء القلوب، أيها المعزي الجليل، يا ساكن القلوب العذب،\nأيتها الاستراحة اللذيذة. أنتَ في التعبِ راحة وفي الحرِّ اعتدال\nوفي البكاء تعزية، أيها النور الطوباوي، إملأ باطن قلوب المؤمنين،\nلأنه بدون قدرتك لا شيء في الإنسان ولا شيء طاهر،\nطهّر ما كان دنساً، إسقِِ ما كان يابساً، إشفِ ما\nكان معلولا، ليِّن ما كان صلباً، أضرم ما كان بارداً،\nدبِّر ما كان حائداً. أعط مؤمنيك المتكلين عليك المواهب السبع،\nإمنحهم ثواب الفضيلة، هب لهم غاية الخلاص، أعطهم السرور الأبدي.\nآمين. يا مريم، أيتها العذراء الكليّة الطهارة، أنتِ التي بحبلك\nبلا دنس، جعل منك الروح القدس بيت القربان الإلهي، صلّي\nلأجلنا ? لكي يأتي الروح القدس الله، قريباً، ويجدّد وجه\nالأرض. ( السلام الملائكي ) . – يا مريم، أيتها\nالعذراء الكليّة الطهارة، أنتِ التي بسرِّ التجسّد، أصبحت بالروح القدس\nأمّ الله الحقيقية، صلّي لأجلنا ? لكي يأتي الروح القدس\nالله، قريباً، ويجدّد وجه الأرض. ( السلام الملائكي ) .\n– يا مريم، أيتها العذراء الكليّة الطهارة، أنتِ التي صلّيتِ\nفي العلّية مع الرسل فامتلأت بفيض من الروح القدس، صلّي\nلأجلنا ? لكي يأتي الروح القدس الله، قريباً، ويجدّد وجه\nالأرض. ( السلام الملائكي ) . صلاة لاستمداد مواهب الروح\nالقدس: يا حبيبي يسوع، يا ذا الجود والصلاح، يا من\nقبل صعودك إلى السماء، وعدت تلاميذك بإرسال روحك القدّوس إليهم،\nليعزّيهم ويشدّدهم. تعطّف وأرسل إلينا هذا الروح الذي يقدّس النفوس\n، ليحلّ فينا ويقدّسنا ويملأنا من مواهبه السنيّة. آمين .\n1) على الحبة الكبيرة: تعال يا روح الحكمة، وحلّ فينا،\nلتدلّنا على الخير الحقيقي، وتوفّر لنا وسائل الحصول عليه .\n( الأبانا مرة واحدة ). على الحبات السبع الصغيرة :\nأرسل روحَكَ فيُخلقوا، ويتجدَّد وجه الأرض. المجد للآب الأزليّ، والإبن\nالوحيد الفادي، والروح الحيّ المعزّي، الآن وإلى الأبد. آمين .\n2) على الحبة الكبيرة : تعال يا روح الفهم، وحلّ\nفينا، وأنر عقولنا لنُدرك حقائق ديانتنا المقدّسة وأسرارها العميقة. (\nالأبانا مرة واحدة ). على الحبات السبع الصغيرة : أرسل\nروحَكَ فيُخلقوا، ويتجدَّد وجه الأرض. المجد للآب الأزليّ، والإبن الوحيد\nالفادي، والروح الحيّ المعزّي، الآن وإلى الأبد. آمين . 3)\nعلى الحبة الكبيرة : تعال يا روح العلم، وحلّ فينا،\nلنعرف الله ونعرف ذواتنا والآخرين، لأنّ المعرفة أساس المحبّة. (\nالأبانا مرة واحدة ). على الحبات السبع الصغيرة : أرسل\nروحَكَ فيُخلقوا، ويتجدَّد وجه الأرض. المجد للآب الأزليّ، والإبن الوحيد\nالفادي، والروح الحيّ المعزّي، الآن وإلى الأبد. آمين . 4)\nعلى الحبة الكبيرة : تعال يا روح المشورة، وحلّ فينا،\nونوّرنا لنعرف مشيئة الله، وقوّنا على إتمامها. ( الأبانا مرة\nواحدة ). على الحبات السبع الصغيرة : أرسل روحَكَ فيُخلقوا،\nويتجدَّد وجه الأرض. المجد للآب الأزليّ، والإبن الوحيد الفادي، والروح\nالحيّ المعزّي، الآن وإلى الأبد. آمين . 5) على الحبة\nالكبيرة : تعال يا روح القوّة، وحلّ فينا، واملأ قلوبنا\nمن الله، وقوّنا على إتمام واجباتنا بكلّ أمانة وإخلاص. (\nالأبانا مرة واحدة ). على الحبات السبع الصغيرة : أرسل\nروحَكَ فيُخلقوا، ويتجدَّد وجه الأرض. المجد للآب الأزليّ، والإبن الوحيد\nالفادي، والروح الحيّ المعزّي، الآن وإلى الأبد. آمين . 6)\nعلى الحبة الكبيرة : تعال يا روح المخافة، وحلّ فينا،\nوقوّنا على أن نحترم الله وأوامره ووصاياه، لأن رأس الحكمة\nمخافة الله. ( الأبانا مرة واحدة ). على الحبات السبع\nالصغيرة : أرسل روحَكَ فيُخلقوا، ويتجدَّد وجه الأرض. المجد للآب\nالأزليّ، والإبن الوحيد الفادي، والروح الحيّ المعزّي، الآن وإلى الأبد.\nآمين . 7) على الحبة الكبيرة : تعال يا روح\nالتقوى، وحلّ فينا، وأنعم علينا بأن نختبر أن نيرك طيّب\nوحملك خفيف ونستطيع حمله. ( الأبانا مرة واحدة ). على\nالحبات السبع الصغيرة : أرسل روحَكَ فيُخلقوا، ويتجدَّد وجه الأرض.\nالمجد للآب الأزليّ، والإبن الوحيد الفادي، والروح الحيّ المعزّي، الآن\nوإلى الأبد. آمين . صلاة للروح القدس أعطتها مريم “سيدة\nجميع الشعوب”: أيّها الربّ يسوع ، يا ابن الآب، أفض\nالآن روحَك على الأرض، وأسكن الروح القدس في قلوب جميع\nالشعوب، ليُحفظوا من الفساد ومن الحرب ومن الآفات، ولتكن سيّدة\nجميع الشعوب، وهي مريم، محاميةً لنا، آمين."
    },
    "6": {
        "title": "صلاة الوجه الأقدس وإكليل الشوك",
        "lang": "ar",
        "image": "6.jpg",
        "content": "مسبحة الوجه الأقدس يا أيّها الوجه المقدس، إنّنا نطلبك حتى\nتستجيب لصلواتنا. أنت قادر على مساعدتنا بطريقة عجيبة، أيها الإله\nالقدوس، الإله القوي، الإله الذي لا يموت، ارحمنا و ارحم\nالعالم أجمع! أدِر وجهك نحونا حتّى ننال الخلاص. على الحبات\nالكبيرة تتلى الصلاة التالية : أيها الآب الأزلي إننا نقدم\nلك بتواضع و حرارة الاستحقاقات اللامتناهية و عذابات الوجه المقدس،\nدمعه الثمين، و كلّ جراحات و دموع يسوع لمجدك و\nلمعونتنا في حاجتنا المُلحة. و على الحبات الصغيرة تتلى الصلاة\nالتالية عوضاً عن السلام: على مجموعة الحبات العشر الأولى :\nأيّها الوجه المقدس المغطى بالجروح، ارحمنا نحن المستغيثون بك. على\nمجموعة الحبات العشر الثانية : أيّها الوجه المقدس المغطى بالدماء،\nارحمنا نحن المستغيثون بك. على مجموعة الحبات العشر الثالثة: أيّها\nالوجه المقدس الذي يذرف دموع الحب اللامتناهي، ارحمنا نحن المستغيثون\nبك. على مجموعة الحبات العشر الرابعة: أيّها الوجه المقدس المحتَقر\nو المُهان، ارحمنا نحن المستغيثون بك. على مجموعة الحبات العشر\nالخامسة: أيّها الوجه المقدس الذي يتحمّل أشدّ الآلام بصمت، ارحمنا\nنحن المستغيثون بك. صلاة الختام: هلمّوا نعبد وجه ربنا ومخلّصنا\nيسوع المسيح الأقدس الذي استحقاقاته لامتناهية ورحمته لا تقاس، ليمنحنا\nغفراناً لخطايانا وندامة حقيقية. هلّموا نواسي الوجه الأقدس بنقاوة سيرتنا،\nبالشهادة لإيماننا دون خوف، وبعمق حبّنا. آمين فعل تكريم إكليل\nالشوك “ظهر الرّب يسوع على المكرّمة “ماريا-مارتا شمبون”، بحالةٍ تثير\nفي النفس الشفقة، مكللًا بإكليلٍ من شوك. قال لها: ها\nهو من تطلبونه، والحالة التي هو فيها ! أنظروا !\nإنزعوا الأشوك عن رأسي وقدّموها الى الآب السماوي، على نيّة\nالخطأة باستحقاقات آلامي. إذهبوا وابحثوا عن نفوسٍ.” وبينما هي تتأمّل\nإكليل الشوك، رأت أشعّة نورٍ تنبثق من كلّ شوكةٍ على\nهامته المقدّسة. فاستوحت الصلاة التالية: “أيّها الرّب الحبيب، إنّي أحزن\nعندما أشاهد حالتكَ المزرية وأنتَ مُكلّلٌ بإكليل الشوك على هامتكَ.\nوأرغب بأن أنزع عنكَ الأشواك لأقدّمها الى الآب الأزلي باستحقاقاتِ\nجروحاتك لأجل خلاص الخطأة. كما أودّ أن أضمّ كلّ أعمالي\nالى استحقاقات إكليل شوكك الأقدس، ليكسبوا لي استحقاقاتٍ جمّة. آمين."
    },
    "7": {
        "title": "مسبحة القديس يوسف البتول †",
        "lang": "ar",
        "image": "7.jpg",
        "content": "على الحبّات الخمس الكبيرة: الأبانا على الحبّات الصغيرة : السّلام\nعليكَ يا يوسف ابن داوود ..يا رجلاً صِدّيقاً وعروس مريم\nالبتول التي وُلد منها يسوع ..يا قديس يوسف الأب المربّي\nلسيِّدنا يسوع المسيح صلِّ لأجلنا نحن الخطأة الآن وفي ساعة\nموتنا….آمين ثم المجد للآب والإبن والروح القدس كما كان في\nالبدء والآن وعلى الدوام والى أبد الآبدين…آمين أسرار مسبحة القديس\nيوسف السر الأول : لنتأمّل القديس يوسف قُرب سيّدتنا مريم\nالعذراء أثناء ولادة سيّدنا يسوع المسيح ثمرة السر: طهارة الفكر\nوالقلب والأفعال (مرّة أبانا 10 السلام عليكَ يا يوسف ..)\nالسر الثاني : لنتأمل القديس يوسف يقدم الطفل الإلهي الى\nالهيكل ثمرة السر :الإتحاد بالله وتتميم وصاياه (مرّة أبانا 10\nالسلام عليكَ يا يوسف ..) السر الثالث : لنتأمّل القديس\nيوسف هارِباً الى مِصر مع الطفل الإلهي ثمرة السر :الثّقة\nبالعناية الإلهية والتسليم (مرّة أبانا 10 السلام عليكَ يا يوسف\n..) السر الرابع : لنتأمّل القديس يوسف الأب المربّي ليسوع\nفي النّاصرة والعامل معه ثمرة السر : تقديس العمل (مرّة\nأبانا 10 السلام عليكَ يا يوسف ..) السر الخامس :\nلنتأمّل القديس يوسف مائِتاً بين يديّ يسوع ومريم ثمرة السر\n: المِيتَة الصالحة (مرّة أبانا 10 السلام عليكَ يا يوسف\n..) صلاة عند ختام المسبحة : يا يسوع و مريم\nو يوسف إنّي أعطيكم قلبي وروحي وجسدي يا يسوع ومريم\nو وسف أعينوني الآن وفي ساعة موتي يا يسوع ومريم\nويوسف إمنحوني أن أموت بسلام بين أيديكم † آمين صلاة\nهامّة لمار يوسف شفيع الكنيسة العام (البابا لاون الثالث عشر)\nإليكَ نهرعُ في شدائدنا، أيّها الطوباوي يوسف، ونستغيثُ واثقين بِحمايتك\nبعد أن استعنّا بِحماية عروسك مريم الكليّة القداسة. نَسألك متوسّلين\nبحقّ ذاك الرباط الوثيق، رباط المحبّة، الذي وحّد بينكَ وبين\nالعذراء البريئة مِن العيب أمِّ الله، وبالحبّ الأبوي الذي احتضنت\nبه الطفل يسوع، أن تنظُر مُنعطفًا إلى الميراث الذي اقتناه\nيسوع المسيح بِدمه، وتُساعدنا في حاجاتنا بِما لك مِن الفعل\nوالمَقدرة، يا حارسًا جزيل العناية بالعائلة المقدسة، أي ذريّة يسوع\nالمسيح المُختارة. فاصرف عنا، أيها الأبُ الفائقةُ محبّته، وباءَ الأضاليل\nوالمَفاسد بأسرها. يا نصيرنا القدير، بِعطفك علينا، قفْ إلى جنبنا\nعضدًا مِن السماء في هذه المعركة بيننا وبين قوات الظلام.\nوكما خلّصت يومًا الطفل يسوع مِن الخطر العظيم المُحدِق بحياته،\nهكذا احمِ الآن كنيسة الله المُقدّسة مِن مكايد الأعداء ومِن\nكلّ كارثة. أبسط على كلٍّ مِنّا ظلَّ حمايتك الدائمة، بحيث\nنستطيع، على مِثالك وبواسطة معونتك، أن نحيا حياة مقدّسة، ونموت\nميتةً صالحة، ونحصل على السعادة الأبديّة في السموات. آمين. ✞\n♥ ✞"
    },
    "8": {
        "title": "مسبحة جراحات يسوع المقدّسة ووعوده السماويّة †",
        "lang": "ar",
        "image": "8.jpg",
        "content": "وعود ربّنا يسوع المسيح للمتعبّدين لجِراحه المقدسة (الى المكرّمة ماريا\nمارتا شامبون 1907- 1841 Maria Martha Chambon) 1- كلّما نطقتم\nبكلمة من كلمات المسبحة، سكَبتُ قطرةً مِن دَمي على نفسِ\nأحد الخطأة. 2- في كلّ مرة تقدّمون فيها استحقاقات جراحاتي\nالإلهية لأبي تكسبون كنزاً كبيراً. 3- النفوس التي تكون قد\nتأمّلت وكرّمت إكليل الشوك الذي كُللت به، ستتكلّل بإكليل مجدي\nفي السماء. 4- إنّي أعطي كلّ ما يسألونني إيّاه بالصلاة\nإلى جراحاتي المقدسة، ستنالون كلّ شيء لأنّه يكون باستحقاق دمي\nالذي لا يقدّر بثمن، بجِراحاتي وقلبي الإلهي يُنال كلّ شيء.\n5- مِن جراحاتي تنبثقُ ثمار القداسة فكما أنّ الذهب المُنقى\nفي أتون النار يصبح أكثر جمالاً، كذلك يجب أن تضعوا\nنفوسكم ونفوس أحبّائكم في جراحاتي المقدّسة فتصبح رائعة كالذهب في\nالتّنور، يمكنكم دائماً أن تنقّوا نفوسكم داخِل جراحاتي. 6- جراحاتي\nتشفي جروحكم، جراحاتي ستغطي كلّ ذنوبكم، أولئك الذين يكرّمون جراحاتي\nسينالون معرفةً حقيقيةُ ليسوع المسيح، وبتأمّلكم فيها ستجدون دائماً حباً\nجديداً، جِراحاتي ستُغطّي كلّ آثامكم. 7- إغمسوا أعمالكم في جراحاتي\nفيكون لها قيمة، كلّ أعمالكم حتّى أصغرها، إذا غُمِست بدمي\nستَنال بذلك وحده استحقاقاتٍ لامتناهية وسَتُسِرّ قلبي. 8- إذا قدّمتم\nجراحاتي لاهتداء الخطاة، فحتّى لو لم يهتدِ الخطأة، فستنالون الاستحقاق\nذاته أمام الله كما لو أنّهم اهتدوا. 9- إذا كنتم\nتعانون مِن أيّة مشكلة أو ألم، أسرعوا بوَضعِه في جراحاتي\nفيُسَكَّن ألمكم. 10- يجب تكرار الدّعاء التالي بالقرب من المرضى\n” يا يسوع اغفر لي وارحمني، باستحقاقات جراحاتِك المقدسة.” فبهذه\nالصلاة تسكينٌ لآلام النفس والجسد. 11- الخاطئ الذي يكرّر الصلاة\nالتالية سينال نعمة الارتداد ” أيّها الآب الأزلي إنّي أقدّم\nلك جراحات سيدنا يسوع المسيح، لكي تشفي جراحات نفوسنا. 12-\nلن تهلكَ النفس التي تلفظ أنفاسها الأخيرة مُبتهلةً الى جراحاتي،\nبل ستُعطى الحياة الحقّة. 13- هذه المسبحة تساوي ثقل عدالتي\n(دينونتي) وهي تهدّئُ غضبي. 14- أولئك الذين يُصلّون بتواضعٍ ويتأمّلون\nفي آلامي، سيُشاركون يوماً ما في مجدِ جراحاتي الإلهية. 15-\nكلّما ازداد تأمّلكم بجراحاتي الأليمة على هذه الأرض، كلّما زاد\nتأمّلكم مجدًا بها في السماء. 16- النفس التي تكون قد\nكرّمت جراحاتي المقدسة خلال حياتها وقدّمتها للآب الأزلي من أجل\nالنفوس المطهرية، تصحبها عند ساعة مماتها مريم البتول مع الملائكة،\nوأنا الإله المصلوب المشعّ مجداً أستقبلها وأكلّلها (أكافئها). 17- جروحاتي\nهي كنز الكنوز بالنسبة الى الأنفس المطهريّة … 18- إن\nالصلاة لجراحاتي المقدّسة ستمنح الكنيسة انتصاراً مُتواصلًا !! كيفيّة تلاوة\nمسبحة جراحات يسوع المقدّسة (تتلى باستخدام المسبحة الوردية الاعتيادية) ———————-\n1- يا يسوع الفادي الإلهي، إرحمنا وارحم العالم أجمع، آمين.\n2- أيّها الإله القدوس، الإله القوي، الإله الذي لا يموت،\nإرحمنا وارحم العالم أجمع. آمين. 3- نعمتك ورحمتك امنحنا يا\nيسوع، في المخاطر الحالية، واسكب علينا دمك الكريم. آمين. 4-\nأيّها الآب الأزلي ارحمنا، بحق دم يسوع المسيح ابنك الوحيد.\nأصنع إلينا رحمةً، نسألك ذلك متضرّعين. آمين آمين آمين. —–\n* ** على الحبات الكبيرة (عوضاً عن الأبانا) تتلى الصلاة\nالتالية: أيّها الآب الأزلي إنّي أقدّم لك جِراحات سيدنا يسوع\nالمسيح، لكي تشفي جراحات نفوسنا. —– ****** على الحبات الصغيرة\n(عوضاً عن السلام) تتلى الصلاة التالية: يا يسوع إغفر لي\nوارحمني باستحقاقات جراحاتك المقدسة، وأوجاع والدتِك. عند ختام المسبحة، يُقال\nثلاثاً: أيّها الآب الأزلي، إنّي أقدّم لكَ جِراحات سيّدنا يسوع\nالمسيح لكي تُشفي جراحات نفوسنا. في إحدى الأيّام بينما كانت\nالقديسة جيرودوته غارقة في الصلاة تتأمّل جراحات المُخلّص، كوفِئَ حَنانها\nبرؤية ربّنا يسوع المسيح الذي ظهر لها وعلى جراحاته تتألّقُ\nورودٌ ذهبية. فقال الربّ لها: ” سأظهر لكِ بهذا الشكل\nالمُنير في ساعة موتكِ، وسأغطّي كلّ خطاياكِ، و سأزيّنك بمجدٍ\nشبيهٍ بالمجد الذي زُيّنتِ به جِراحاتي بتحيّاتك. وكلّ مَن يفعل\nمِثلك سَيَنالُ نعمةً مُشابهةً !"
    },
    "9": {
        "title": "أفعال التعويض الخمسة لقلب يسوع الأقدس ♥†",
        "lang": "ar",
        "image": "9.jpg",
        "content": "الفعل الأوّل: تعويضًا عن الذين لا يزورونه في الكنائس يا\nيسوع إلهيّ، أنا أسجد لك سجودًا كليًّا في القربان المقدّس،\nوأؤمن أنّك إله وإنسان حقّ، قاصدًا أن أعوّض لك من\nفتور كثيرين من المؤمنين الذين لا يلتفتون إليك بمرورهم أمام\nكنائسك، وبحضورهم قدّام مذابحك، حيثما تشتهي بكمال الحبّ أن تهبهم\nذاتك، وهم على مثال الإسرائيليّين في البريّة يكرهون هذا المنّ\nالسماويّ. فأنا أقدّم لك هذا الدمّ الثمين الذي سفكته من\nجرح رجلك الشمال، تعويضًا من هذا الفتور الممقوت. وفي هذا\nالجرح الأقدس أكرّر مرّات لا تحصى قائلاً: فليُشكر يسوع في\nكلّ زمان ويُمجّد في سرّ القربان أبانا والسلام والمجد الفعل\nالثاني: تعويضًا عن الذين لا يرافقونه في الدروب يا يسوع\nإلهي، أنا أسجد لك سجودًا كليًّا، وأؤمن أنّك حاضر في\nالسرّ الأقدس. وأنوي أن أعوّض لك من عدم معروف كثيرين\nمن المؤمنين، الذين إذ يرونك محمولاً إلى المرضى لتعزيّهم في\nسفرهم إلى الأبديّة لا يرافقونك، وبالجهد يسجدون لك ظاهرًا، فأنا\nأقدّم لك، تعويضًا من هذا الفتور، الدم الثمين الذي سفكته\nمن جرح رجلك اليمين، الذي فيه أكرّر مرّات كثيرة قائلاً:\nفليُشكر يسوع في كلّ زمان ويُمجّد في سرّ القربان أبانا\nوالسلام والمجد الفعل الثالث: تعويضًا عن الذين يهينونه في الزيارات\nيا يسوع إلهي، الخبز الحقيقيّ للحياة الأبديّة، أنا أسجد لك\nسجودًا كليًّا. وأنوي أن أعوّض لك من الجراح الكثيرة التي\nتجرح قلبك كلّ يوم بتدنيس كنائسك، حيث تقيم تحت الأشكال\nالسريّة، ليسجد لك ويحبّك المؤمنون بك. أقدّم لك، تعويضًا من\nهذه الإهانات، الدم الثمين الذي سفكته من جرح يدك اليسرى\nالذي به أكرّر في كلّ وقت قائلاً: فليُشكر يسوع في\nكلّ زمان ويُمجّد في سرّ القربان أبانا والسلام والمجد الفعل\nالرابع: تعويضًا عن الذين يهينونه في القدّاس يا يسوع إلهي،\nالخبز الحيّ الذي نزل من السماء، إنّي أسجد لك سجودًا\nكليًّا. وأنوي أن أعوّض لك من الإهانات الكثيرة الصادرة عن\nالمؤمنين بك، بحضورهم القدّاس الإلهيّ حيث تجدّد، بوفور حبّك، الذبيحة،\nولو بنوع غير دموي، المكتملة على الجلجلة لأجل خلاصنا. فأنا\nأقدّم لك، تعويضًا من عدم المعروف هذا، الدم الثمين الذي\nسفكته من جرح يدك اليمنى. الذي فيه أرتّل مع الملائكة\nالمحيطين بك قائلاً: فليُشكر يسوع في كلّ زمان ويُمجّد في\nسرّ القربان أبانا والسلام والمجد الفعل الخامس: تعويضًا عن الذين\nيهينونه في المناولات: يا يسوع إلهيّ، الذبيحة الحقيقيّة عن خطايانا،\nأنا أسجد لك سجودًا كليًّا، وأقدّم لك هذا السجود، تعويضًا\nمن هَتْك الأقداس الذي يرتكبه ناكرو الجميل الذين يتقدّمون إلى\nالمناولة بحالة الخطيئة المميتة. فتعويضًا من هذا النفاق المكروه، أقدّم\nلك قطرات دمك الأخيرة المسفوكة من جرح قلبك الأقدس الذي\nفيه أدخل لأسجد لك وأباركك وأحبّك وأكرّر مع الذين يكرّمونك\nفي القربان المقدّس قائلاً: فليُشكر يسوع في كلّ زمان ويُمجّد\nفي سرّ القربان أبانا والسلام والمجد صــــلاة يا قلب يسوع\nالأقدس إنّي واثق بك. يا يسوع أنت ذو القلب الشفيق،\nالكليّ الجودة والصلاح. أنت تراني وتحبّني أنت رحوم وغفور إذ\nلا يمكنك أن ترى الشقاء دون أن ترغب في مداوته،\nها إنّي أضع كلّ رجائي فيك وواثق بأنّك لن تهملني.\nوإنّ إنعامك تفوق دائمًا آمالي فحقّق لي يا يسوع جميع\nوعودك وامنحني النِعم اللازمة لحالتي وألقِ السلام في عائلتي وعزِّني\nفي شدائدي وكن ملجأي مدّة حياتي وساعة موتي. وإن كنتُ\nخاطئًا سأجد في قلبك ينبوع المراحم، أو كنتُ فاترًا في\nإيماني فإنّي سأزداد بواسطتك حرارة، أو كنتُ حارًّا فإنّي سأرتقي\nدرجات الكمال. أنعم عليّ يا يسوع بنعمة خاصّة أليّن بها\nالقلوب القاسية وأنشر عبادة قلبك الأقدس واكتُب اسمي على قلبك\nالمعبود كي لا يُمحى إلى الأبد وأسألك أن تبارك مسكني\nحيث تكرّم صورة قلبك الأقدس."
    },

        "content": "Prayer to St. Joseph over 1900 years old Oh St.\nJoseph whose protection is so great, so strong, so prompt\nbefore the Throne of God, I place in you all\nmy interests and desires. Oh St. Joseph do assist me\nby your powerful intercession and obtain for me from your\nDivine Son all spiritual blessings through Jesus Christ, Our Lord;\nso that having engaged here below your Heavenly power I\nmay offer my Thanksgiving and Homage to the Loving of\nFathers. Oh St. Joseph, I never weary contemplating you and\nJesus asleep in your arms. I dare not approach while\nHe reposes near your heart. Press him in my name\nand kiss His fine Head for me, and ask Him\nto return the Kiss when I draw my dying breath.\nSt. Joseph, Patron of departing souls, pray for us. Amen."

    "11": {
        "title": "رتبة درب الصليب وزياح الصليب",
        "lang": "ar",

        "content": "رتبة درب الصليب وزياح الصليب - موقع سلطانة الحبل بلا\nدنس درب الصليب | الصوم - مقالات رتبة درب الصليب\nعلى المؤمن إذا مارس رتبة درب الصليب وحده، أن يتلو\nفعل الندامة ويتأمّل في كلّ مرحلة من مراحل درب الآلام\nمتنقّلاً في الكنيسة من مرحلة إلى مرحلة. أمّا في الرتبة\nالجمهوريّة فيتنقّل الكاهن يرافقه الصليب وشمعتان، من مرحلة إلى مرحلة،\nتاليًا التأمّل، وبين كلّ مرحلة ومرحلة ينشد المرتّلون بيتًا من\nنشيد كانت الأمُّ الوجيعة أو مريمُ الأمّ الحزينة، فيجيب الشعب\nكلّ مرّة أيّتها الأمُّ القدّيسة أو يا شريكةَ الفداء، جاثيًا\nوقت التأمّل، واقفًا وقت النشيد. يا ربّي وإلهي أنا نادمٌ\nمِن كلِّ قلبي على جميعِ خطاياي لأنِّي بالخطيئةِ خسِرْتُ نَفسي\nوالخيراتِ الأبديَّة، واستَحقَقْتُ العَذاباتِ الجهنّميَّةَ ولكنْ بالأكثرْ أنا نادمٌ لأنَّني\nأغظتُكَ وأهنتُكَ يا ربِّي وإلهي، المُستحِقَّ كلَّ كرامةٍ ومَحبَّة. لهذا\nالسببِ أبغُضُ الخطيئةَ فَوقَ كلِّ شَرّ، وأُريدُ بِنعمتِكَ أنْ أموتَ\nقبْلَ أنْ أَغيظَكَ فيما بعْد. وأقصِدُ أنْ أهرُبَ مِنْ كلِّ\nسبَبِ خطيئَة، وأنْ أفيَ بقَدْرِ استِطاعَتي عن الخطايا الَّتي فعلتُها.\nآمين كانتِ الأمُّ الوجيعةْ والدُّموعْ منها سَريعةْ واقفة تحتَ الصَّليب\nاللازمة: أيّتُها الأمُّ القدّيسةْ إجعَلي جراحاتْ وحيدِك في قلبي مُنطَبِعَةْ\nالمرحلة الأولى الكاهن : لنتأمل يسوع محكوماً عليه بالموت الكاهن\n: نـســجـد لـك أيـهـا الـمـســــيـح و نـبـاركـكْ الشعب : لأنكَ\nبـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ العـالـمْ الكاهن : يا سيدي يسوع المسيح،\nلأجل هذا الحكم غير العادل الذي سببته لك خطاياي، نجني\nمن حكم الموت الأبدي الذي استحققته مراراً عديدة. آمين. أبانا\n... أعطنا ... السلام ... يا قديسة ... الكاهن :\nارحمنا يا رب الشعب : ارحمنا الكاهن : فلتسترح أنفس\nالموتى المؤمنين. الشعب : برحمة الله والسلام. آمين. نفسُها تلكَ\nالحزينَةْ في توجُّعِها كمينَةْ صابَها سَيفٌ مُريبْ أيّتُها الأمُّ القدّيسةْ\nإجعَلي جراحاتْ وحيدِك في قلبي مُنطَبِعَةْ المرحلة الثانية الكاهن :\nلنتأمل يسوع حاملاً صليبه على منكبيه الكاهن : نـســجـد لـك\nأيـهـا الـمـســــيـح و نـبـاركـكْ الشعب : لأنكَ بـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ\nالعـالـمْ الكاهن : يا يسوع، أنت الذي قد حملت بارادتك\nال \nوحدها وان اجاوبَ عليها دائماً. آمين. أبانا ... أعطنا ...\nالسلام ... يا قديسة ... الكاهن : ارحمنا يا رب\nالشعب : ارحمنا الكاهن : فلتسترح أنفس الموتى المؤمنين. الشعب\n: برحمة الله والسلام. آمين. يا أمَّ ينبوعِ المحبَّةْ إمنَحيني\nمنكِ هبَةْ التَّوجُّعْ والنَّحيبْ أيّتُها الأمُّ القدّيسةْ إجعَلي جراحاتْ وحيدِك\nفي قلبي مُنطَبِعَةْ المرحلة التّاسعة الكاهن : لنتأمل يسوع وقعاً\nتحت الصليب مرة ثالثة. الكاهن : نـســجـد لـك أيـهـا الـمـســــيـح\nو نـبـاركـكْ الشعب : لأنكَ بـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ العـالـمْ الكاهن\n: يا يسوع، بحق العذابات التي احتملتها في سقوطك الثالث\nتحت الصليب، اطلب منك ان لا تسمح بأن اسقط في\nالخطيئة مرة ثانية ابداً. نعم، يا يسوع، انني ارتضي بأَن\nأموت قبل أن أسقط في خطيئة من جديد. آمين. أبانا\n... أعطنا ... السلام ... يا قديسة ... الكاهن :\nارحمنا يا رب الشعب : ارحمنا الكاهن : فلتسترح أنفس\nالموتى المؤمنين. الشعب : برحمة الله والسلام. آمين. إمنَحي نارًا\nلِقلبي يَشتعِلْ بِيَسوعَ ربّي صاحبِ الحُبِّ العَجيبْ أيّتُها الأمُّ القدّيسةْ\nإجعَلي جراحاتْ وحيدِك في قلبي مُنطَبِعَةْ المرحلة العاشرة الكاهن :\nلنتأمل يسوع ما عُرّي من ثيابه وسُقي خَلاً ومُرًّا. الكاهن\n: نـســجـد لـك أيـهـا الـمـســــيـح و نـبـاركـكْ الشعب : لأنكَ\nبـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ العـالـمْ الكاهن : يا يسوع، أنت الذي\nعُرّيتَ من ثيابك وسقيت مُرًّا أسألك ان تعريني من الانشغاف\nبالأَشياء الأرضية. واجعلني أكره كل تعلّق بالدنيا والخطيئة. آمين. أبانا\n... أعطنا ... السلام ... يا قديسة ... الكاهن :\nارحمنا يا رب الشعب : ارحمنا الكاهن : فلتسترح أنفس\nالموتى المؤمنين. الشعب : برحمة الله والسلام. آمين. إجعَلي أمّي\nالحنونَةْ الجراحاتِ الثَّمينَةْ قلبَنا القاسي تُصيبْ أيّتُها الأمُّ القدّيسةْ إجعَلي\nجراحاتْ وحيدِك في قلبي مُنطَبِعَةْ المرحلة الحادية عشرة الكاهن :\nلنتأمل يسوع مسمَّرًا على الصليب. الكاهن : نـســجـد لـك أيـهـا\nالـمـســــيـح و نـبـاركـكْ الشعب : لأنكَ بـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ العـالـمْ\nالكاهن : يا يسوع، بحق الآلام التي احتملتها بتسميرك على\nالصليب في يديك ورجليك بمسامير قاسية، اجعلني اصلب جسدي بروح\nالامانة المسيحية. آمين. أبانا ... أعطنا ... السلام ... يا\nقديسة ... الكاهن : ارحمنا يا رب الشعب : ارحمنا\nالكاهن : فلتسترح أنفس الموتى المؤمنين. الشعب : برحمة الله\nوالسلام. آمين. ابنُكِ مَجروحْ مُؤلَّمْ وهو مِن أجلي تألَّمْ أعطيني\nمِنهُ نَصيبْ أيّتُها الأمُّ القدّيسةْ إجعَلي جراحاتْ وحيدِك في قلبي\nمُنطَبِعَةْ المرحلة الثانية عشرة الكاهن : لنتأمل يسوع مائتاً على\nالصليب الكاهن : نـســجـد لـك أيـهـا الـمـســــيـح و نـبـاركـكْ الشعب\n: لأنكَ بـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ العـالـمْ الكاهن : يا يسوع\nإلهي، انت الذي، بعد ان نازعت ثلاث ساعات على الصليب\nبأَوجاع مرّة، متّ لأَجلي، اجعلني اموت قبل ان اسقط في\nالخطيئة فيما بعد. واذا شئت ان احيا فلتكن حياتي فقط\nحتى احبك وأخدمك بكل امانة. آمين. أبانا ... أعطنا ...\nالسلام ... يا قديسة ... الكاهن : ارحمنا يا رب\nالشعب : ارحمنا الكاهن : فلتسترح أنفس الموتى المؤمنين. الشعب\n: برحمة الله والسلام. آمين. أشْرِكيني في نَحيبِكْ حينما عُلِّقْ\nحَبيبِكْ واجرَحي قَلبي الكئيبْ أيّتُها الأمُّ القدّيسةْ إجعَلي جراحاتْ وحيدِك\nفي قلبي مُنطَبِعَةْ المرحلة الثالثة عشرة الكاهن : لنتأمل يسوع\nمنزلاً ع الصليب وموضوعاً في حضن أمه. الكاهن : نـســجـد\nلـك أيـهـا الـمـســــيـح و نـبـاركـكْ الشعب : لأنكَ بـصـليـبـِكَ الـمُـقـدس\nأفـتـديـتَ العـالـمْ الكاهن : يا مريم الأُم الحزينة، ما اعظم\nسيفَ الوجع الذي جازَ في قلبك عندما رأيتِ ابنَكِ يسوع\nالعزيز مائتاً في حضنكِ. فأطلبي لي يا مريم ان اكره\nدائماً الخيطئة سببَ موته وتألمك الشديد، وان احيا مسيحياً حقيقياً\nواخلص نفسي. آمين. أبانا ... أعطنا ... السلام ... يا\nقديسة ... الكاهن : ارحمنا يا رب الشعب : ارحمنا\nالكاهن : فلتسترح أنفس الموتى المؤمنين. الشعب : برحمة الله\nوالسلام. آمين. إمنَحي عَبْدًا ذَليلاً أنْ يكونْ لكِ خَليلاً ناجِيًا\nمِنَ اللَّهيبْ أيّتُها الأمُّ القدّيسةْ إجعَلي جراحاتْ وحيدِك في قلبي\nمُنطَبِعَةْ المرحلة الرّابعة عشرة الكاهن : لنتأمل يسوع موضوعاً في\nالقبر الكاهن : نـســجـد لـك أيـهـا الـمـســــيـح و نـبـاركـكْ الشعب\n: لأنكَ بـصـليـبـِكَ الـمُـقـدس أفـتـديـتَ العـالـمْ الكاهن : يا يسوع،\nانا اشتهي ان ابقى معك دائما ميتاً عن العالم، وان\nلا احيا إلاَّ لأَجل محبتكَ فقط، لكي اتمتع معك فيما\nبعد في الفردوس السماوي بثمرة آلامك المرة وموتك على خشبة\nالعار. آمين. أبانا ... أعطنا ... السلام ... يا قديسة\n... الكاهن : ارحمنا يا رب الشعب : ارحمنا الكاهن\n: فلتسترح أنفس الموتى المؤمنين. الشعب : برحمة الله والسلام.\nآمين. إذْ يموتُ الجِسمُ منّي بلِّغي نَفْسي التَّمنّي مجْدَ فادينا\nالحَبيبْ أيّتُها الأمُّ القدّيسةْ إجعَلي جراحاتْ وحيدِك في قلبي مُنطَبِعَةْ\nصلاة الكاهن : ايها الآب الازلي الذي قدّس راية الصليب\nالمحيي بدم ابنه الثمين، نسأل مراحمك ان تمنح الذين يكرمون\nهذا الصليب المقدس مغفرة خطاياهم ودخول المجد الأبدي باستحقاقات مخلصنا\nيسوع المسيح. آمين. ابانا. السلام. المجد على نية الحبر الاعظم\nلاكتساب الغفرنات ويبارك الكاهن الشعب بالصليب قائلاً الكاهن : نعمة\nسيدنا يسوع المسيح تكون معكم دائما، وذكر آلامه المقدسة وقوتها\nيستقران في قلوبكم، ورسم صليبه الطاهر ينجيكم من جميع اعدائكم\nبسم الآب والابن والروح القدس الشعب : آمين. زياح الصليب\nتُقام هذه الرتبة في الصوم الأربعينيّ كلّ يوم جمعة مساءً،\nوفي كلّ يوم من أسبوع الآلام، ما عدا يومي الجمعة\nوالسبت. يوضع على المذبح صليب مغطة بوشاح أسود وإلى جانبيه\nشمعتان موقدتان. يا شَعبي وصَحْبي، أينَ عَهدُ الأَيمانْ أينَ الوَفا\nبالحب والوَدادْ والرِّضوانْ كالقاتِلْ والعَدو دَفعتُموني للهوانْ وما بينَ اللِّصَّين،\nصلبْتُموني عُرْيانْ تُرى ماذا عَملي فصارَ هذا جَزائي تُرى مَنْ\nهو المُدّعي، وما هو وُجوبْ قضائي أما تَذكرونَ الجميلْ أما\nتَذكرون سَخائي كَمْ عليلٍ كَمْ سَقيمْ شَفاهُ اعتِنائي يا ناظرينَ\nشِدَّتي، يا مُبْصِرينَ بَلوَتي يا سامِعينْ بُكائي وحَسَرات والِدتي هلْ\nوَجدْتُم مَنْ بُلي وصابَتْهُ مَصيبَتي هلْ مَنْ سُقي كأسي واستَطْعَم\nمَرارتي يا مريم أمّي نَحيبُكِ يَزيدُ أدْمُعي إرحَميني أُسكتي أُترُكيني\nإرْجَعي يا أبتاه لماذا تَتركُني بِوَجَعي خَنقَتْني الحسَراتْ وتَمزَّقَتْ أضلُعي\nيتلو الكاهن صلاة للصليب المقدّس أو الأفعال الخمسة، تكريمًا لجراح\nالسيّد المسيح الخمسة، وبعد كلّ منها يقولون، جوقين، أبانا وسلام\nوالمجد. صلاة للصليب المقدس الكاهن : تَبارَكتَ، أيُّها الصَّليبُ المُقدَّس،\nخَشبةُ الحياة، هادِمُ الضَّلالِ وواهِبُ العالَمِ الخَلاص. أنتَ رايةُ الظَّفَرِ\nفي المعرَكة. بِكَ صُنِعَتِ الآياتُ العَجيبَة. إنَّكَ مُبطِلُ الذَّبائحِ ومُتَمِّمُ\nالأسْرار. بِكَ يأتينا السَّلامُ ويَحِلُّ فينا الفَرَح. بِكَ تَرتَفِعُ الكنيسةُ\nويُصانُ أبناؤُها. بِكَ تَتقدَّسُ أجسادُنا وتَتنَقّى نُفوسُنا. بِكَ تُمحى زَلاتُنا\nويَزيدُ بِرُّنا. بِكَ يُدرِكُ المُؤمنونَ الكَمال. بِكَ يَتسلَّحُ الأحياء. بِكَ\nيَستريحُ الرَّاقدون. بِكَ نَستَظِلُّ في اليومِ الآخِر. ومعَكَ نَسيرُ إلى\nمَنزِلِ الحياة، ونَرفَعُ المَجْدَ إلى المَسيحِ – الكلِمَةِ الَّذي صُلِبَ\nعلَيك، وإلى أبيه وروحِهِ الحَيِّ القدُّوسِ إلى الآبَد. الشعب :\nآمين. الأفعال الخمسة بسم الآب والابن والروح القدس. آمين فعلُ\nالإيمان يا سيّدَنا يسوعَ المسيح ، إنَّنا نُؤمنُ إيمانًا ثابتًا\nبجميعِ ما تُؤمنُ بهِ وتُعلِّمُنا أمُّنا الكنيسةُ المقدَّسةُ أنْ نَعتقِدَ\nبه، لأنَّكَ أنتَ أوحيتَهُ لها، يا مَنْ أنتَ الصِّدقُ الَّذي\nلا تَغِشّ ولا تُغَشّ. فنَسألُكَ بمحبَّتِكَ لوالدَتِكَ القدّيسةِ مريمَ العَذراء\nوصفيِّكَ البارِّ القدِّيسِ يوسفَ البتول، وبِجُرحِ رجلِكَ الشِّمالِ أنْ تَمنحَنا\nنِعمتَكَ لِنَحيا ونَموتَ بها. آمين ابانا. السلام. المجد فعلُ السُّجودِ\nوالشُّكر يا سيِّدَنا يسوعَ المسيح، إنَّنا نَعترِفُ بكَ ونَسجُدُ لكَ\nبما أنَّكَ إلهُنا ومُخلِّصُنا وديّانُنا السَّامي، وإذْ نحنُ مُنحَنون أمامَ\nعظمتِكَ الإلهيَّة، نُقدِّمُ لكَ الشُّكرَ على حميعِ النِّعمِ الَّتي منحتَناها\nوسوفَ تَمنحُها لنا. فنسألُكَ بمحبَّتِكَ لِوالدتِكَ القدّيسةِ مريمَ العذراء وصفيِّكَ\nالبارِّ القدِّيسِ يوسفَ البتول، وبُجرحِ رجلِكَ اليَمين أنْ تَمنحَنا نعمتَكَ\nلنَحيا ونموتَ بها. آمين ابانا. السلام. المجد فعلُ الرَّجاء يا\nسيِّدَنا يسوعَ المسيح، إنَّنا مُتَّكلونَ علَيكَ ومُترجَّون منكَ أنْ تُسعِفَنا\nوتُدبِّرَنا في حياتِنا هذه وتَصفَحَ عنّا ذنوبَنا وتُملِّكَنا نَعيمَكَ الدَّائمَ\nالأبديَّ لأنَّ كلَّ رجائِنا مُتعلِّقٌ على رحمتِكَ غَيرِ المَحدودةِ وصلاحِكَ\nغيرِ المَوصوف. فنسألُكَ بمحبَّتِكَ لِوالدتِكَ القدّيسةِ مريمَ العذراء وصفيِّكَ البارِّ\nالقدِّيسِ يوسفَ البتول، وبُجرحِ يدِكَ الشمال أنْ تَمنحَنا نعمتَكَ لنَحيا\nونموتَ بها. آمين ابانا. السلام. المجد فعلُ المطابقة يا سيِّدَنا\nيسوعَ المسيح، إنّنا مُسلِّمونَ إلى مشيئتِكَ الإلهيّةِ الكلِّيَّةِ الاستِقامَة، ونقبَلُ\nمِنْ كلِّ خاطرِنا الأمراضَ والمصائِبَ والمَوت وكأنَّها منك، بالنَّوعِ والزَّمانِ\nالَّذي تُريدُه أنت. ولا نَرغَبُ يا يسوعَنا الحبيب، إلاّ أنْ\nتَكمُلَ بنا مشيئتُكَ الصَّالحة، الآنَ ودائِمًا وفي كلِّ مكانٍ وزَمان.\nفنسألُكَ بمحبَّتِكَ لِوالدتِكَ القدّيسةِ مريمَ العذراء وصفيِّكَ البارِّ القدِّيسِ يوسفَ\nالبتول، وبُجرحِ يدِكَ اليَمين أنْ تَمنحَنا نعمتَكَ لنَحيا ونموتَ بها.\nآمين ابانا. السلام. المجد فعلُ النَّدامةِ والمحبَّة يا سيِّدَنا يسوعَ\nالمسيح، إنَّنا نادمونَ مِن صَميمِ قلوبِنا، لأنَّنا أهنّاكَ بأفعالِنا السَّيِّئَةِ\nواستَحْقَقنا مِنكَ القصاصَ بِعذاباتٍ زَمنيَّةٍ ونِيرانَ جهنَّمِ الأبديَّةَ، وخسِرْنا لَذّاتِ\nملكوتِكَ السَّماويَّةَ ولا سيَّما لأنَّنا أهنَّا محبَّتَكَ الأبويَّة. يا مَنْ\nأنتَ إلهٌ صالِحٌ ومُستحِقٌّ محبَّةَ جميعِ خلائقِكَ الدَّنيَّة. ونَعزَمُ العَزمَ\nالثَّابِتَ بعدَمِ الرُّجوعِ إلَيها ونَقبَلُ الموتَ ولا نَرتكِبُ خطيئةً واحدةً\nمُميتَة. فنسألُكَ بمحبَّتِكَ لِوالدتِكَ القدّيسةِ مريمَ العذراء وصفيِّكَ البارِّ القدِّيسِ\nيوسفَ البتول، وبُجرحِ جنبِك الطاهر أنْ تَمنحَنا نعمتَكَ لنَحيا ونموتَ\nبها. آمين ابانا. السلام. المجد ويبخِّرُ الكاهن الصليب، ثمّ ينهض\nفيحمله ملتفتًا إلى الشعب، والشعب ينشد: تشبوحتو لمريو تشبوحتو لمريو\nماتَ ابنُ مُعذَّبًا عنّا فوقَ الصَّليبْ وأسلمَ روحَهُ لأبيهِ رَبِّ\nالكونِ العَجيبْ شُقِّقَتِ الصُّخورْ وتَفتَّحَتِ القُبورْ واستَولى العَنا على كُلِّ\nالمَعمورْ طعَنوا بالرُّمحِ قلبَ الَّذي بهِ كلُّ شَيء كانْ فجَرى\nمنهُ دمٌ وماءٌ أحيا بَني الإنسانْ تشبوحتو لمريو إنَّ البيعةَ\nمُذْ أبصرَتْ شَمسَ البِرِّ المُنيرْ على عُودِ العارِ مَصلوبًا وهو\nالإلهُ القَديرْ حزِنَتْ جدًّا وبَكَتْ بِدَمْعٍ غَزيرْ إذْ رأَتْ جِراحَهُ\nوآثارَ المساميرْ خَضَعَتْ وقالَتْ لَهُ ها أنا يا غايَةَ المُنى\nساجِدَةٌ معَ أولادي إذْ مُتَّ لأجلِنا (أو بالسِّريانيّة) تِشْبوحْتو لْمُرْيُو،\nبَزْقيفُا أَشْلِمْ نَفْشِهْ بَرَالُهُو وْيَابْ رُوحُهْ بِيدَايْ أَبُوي هَوْ مُرُو\nدْعُلْمُو وَفْقَعْ قَبْرِه واصْطَرِي شُوعِه ويحَدْ تِمْهو لْخُلْهُنْ بِرْيُوتو وَبْرُومْحو\nتَرعُو لْدَفْنِهْ دَبْرُويُو دْخُولو وَرْدَوْ مِنِهْ دْمُو وْمايو حُوسُيُو لْعُلْمُو\nتِشْبُوحْتُو لْمُرْيو، لْعِلْ مِنْ قَيْسِهْ دَصْليبُو حِزْتِهْ عِيتُو لْهَوْ شِمْ         "content": "كانت القديسة برجيتا تود ان تعلم عدد الضربات التي تلقاها\nسيدنا يسوع المسيح وقت الآمه فظهر لها مخلصنا يسوع المسيح\nوخاطبها قائلاً: إعلمي يا إبنتي أني إحتملت وقت الآمي5480 ضربة\nوإن شئتِ أن تكرمي هذه الجراحات ببعض العبادات إتلي كل\nيوم 15 أبانا و 15 السلام مع الصلوات التالية (التي\nأعلمها إياه بنفسه) طيلة سنة كاملة وعندما تكون السنة قد\nإنقضت تكونين أنتِ قد كرمتِ جراحاتي واحدة فواحدة.. نص الصلوات\nالخمس عشر: الصلاة الإولى: مرة أبانا و السلام يا يسوع\nالمسيح العذوبة الأبدية للذين يحبونك السعادة الفائقة كل سعادة و\nكل امنية رجاء وخلاص الخطأة يا من أظهرت من إجل\nعظيم محبتك إن كمال رضاك هو أن تكون بين البشر\nفإتخذت الطبيعة البشرية… تذكر الأوجاع التي عانيتها منذ لحظة ولادتك\nوخاصة خلال الآمك المقدسة كما كان مقرراً و مرسوماً في\nالفكر الإلهي منذ الأزل…تذكر يا سيد و أنت في العشاء\nالأخير مع تلاميذك بعد أن غسلت أقدامهم قد أعطيتهم جسدك\nالمقدس و دمك الثمين وبينما أنت تعزيهم بعذوبة أطلعتهم على\nالامك المقبلة.. تذكر الحزن و المرارة التي قاسيتها كما عبرت\nعنها قائلاً (نفسي حزينة حتى الموت) تذكر ياسيد المخاوف و\nالضيقات و الأوجاع التي تحملتها في جسدك قبل عذاب الصليب\nبعد أن صليت ثلاث مرات و أنت تتصبب عرقاً دموياً\nو بعد أن خانك تلميذك يهوذا و قبضت عليك الاُمة\nالتي رفعتها و إخترتها و إتهمت من شهود زور و\nحاكمك ظلماً في عيد الفصح القضاة الثلاثة وأنت برئ و\nفي ريعان الشباب.. إنك عريت من ثيابك و اُلبست ثياب\nالسخرية و غطوا وجهك و عينيك وإنك تلقيت اللطمات و\nكللت بالشوك وجعلوا في يدك قصبة وربطت على عمود ممزقاً\nتحت المجالد و رازح تحت الشتائم والعار وتذكاراً لهذه الآلآم\nو الوجاع التي رافقتك فبل عذاب الصليب أعطني ندامة حقيقية\nو إعتراف صحيح و كامل وتوبة صادقة و مغفرة جميع\nذنوبي… آمين الصلاة الثانية: مرة أبانا والسلام يا يسوع الحرية\nالحقيقية للملائكة و فردوس النعيم تذكر هول الحزن الذي عانيته\nعندما أعداؤك كإسود ثائرة أحاطوك و بألف إهانة و بصقة\nوصفعة وغيرها من أغرب العذابات التي ابتليت بها الى أقصى\nحد. أرجوك يا مخلصي أن تنجيني من أعدائي المنظورين وغير\nالمنظورين و توصلني بحمايتك الى الكمال للخلاص الأبدي.. آمين الصلاة\nالثالثة: مرة أبانا والسلام يا يسوع خالق السماء وا لأرض\nالذي لا شيئ يحويه أو يحده أنت الضابط كل شيئ\nبقدرتك تذكر العذاب الشديد المرارة الذي قاسيته عندما ربط الجنود\nيديك المقدستين و قدميك على الصليب و ثقبوها من جهة\nلأخرى بمسامير ضخمة غير مسننة ولما لم يجدوك في حالة\nتمكنهم من إشباع غضبهم و سّعوا جراحاتك و زادوا ألم\nعلى ألم و بوحشية غريبة مددوك على الصليب وسحبوك من\nكل صوب مخلعين أطرافك. أتضرع إليك بحق هذا الألم المقدس\nأنت تهبني مخافتك و محبتك.. آمين الصلاة الرابعة: مرة أبانا\nوالسلام يا يسوع الطبيب السماوي المرفوع على الصليب لتشفي بجراحاتك\nجراحاتنا تذكر شدة الوهن والرضوض التي إحتملتها في كل أطرافك\nحتى لم يبق واحدة منها في موضعها و حتى لم\nيعد يوجد وجع مثل وجعك من قمة الرأس حتى أخمص\nالقدمين جزء واحد من جسدك لم يبق بدون عذاب ومع\nذلك تناسيت الأوجاع ولم تمل الصلاة لأبيك من أجل أعدائك\nقائلاً له (يا ابتِ أغفر لهم لأنهم لا يدرون ما\nيفعلون) من أجل هذه الرحمة الكبيرة و تذكاراً لهذا العذاب\nإجعل ذكرى عذابك المرير يثمر فيّ ندامة كاملة لمغفرة جميع\nخطاياي.. آمين الصلاة الخامسة: مرة أبانا والسلام يا يسوع مرآة\nالضياء الأبدي تذكر الحزن الذي إنتابك و أنت تتامل في\nنور ألوهيتك المنتخبين الذين سيخلصون بإستحقاقات الامك المقدسة وترى في\nنفس الوقت العديد الكبير من المنبوذين الذين يهلكون بسبب خطاياهم\nو تتوجع بمرارة على هؤلاء الخطأة الضائعين اليائسين. إكراماً لهذه\nالرحمة غيرالمتناهية وهذه الشفقة خاصة بحق التسامح الذي أبديته نحو\nاللص الصالح قائلاً (هذا اليوم ستكون معي في الفردوس) أتضرع\nإليك يا يسوع أن تصنع إليّ رحمة في ساعة موتي..\nآمين الصلاة السادسة: مرة أبانا وا لسلام يا يسوع الملك\nالحبوب و المرغوب للغاية تذكر الألم الذي قاسيته و أنت\nعريان معلق و مرفوع على الصليب أهلك جميعهم و أصحابك\nتخلوا عنك عدا والدتك التي بقيت قربك برفقة القديس يوحنا\nو ا نت أو صيتهما الواحد بالآخر قائلاً (يا إمرأة\nهذا إبنك) و للقديس يوحنا (هذه امك). أتوسل إليك يا\nمخلصي ان ترأف بي في جميع بلاياي و مصاعبي الجسدية\nو الروحية و أن تعينني في تجاربي.. آمين الصلاة السابعة:\nمرة أبانا و السلام يا يسوع… الينبوع الذي لا تنضب\nرحمته يا من بتأثر عميق من الحب قلت على الصليب\nأنا عطشان ولكنه العطش لخلاص الجنس البشري أتوسل إليك يا\nمخلصي أن تشعل في قلبي الشوق لأصل للكمال في كل\nأعمالي و أن تطفئ فيّ شهوات الجسد و الميول الدنيوية..\nآمين الصلاة الثامنة: مرة أبانا والسلام يا يسوع عذوبة القلوب\nو حلاوة النفوس بحق مرارة العلقم والخل الذي ذقته حباً\nبنا على الصليب إمنحني أن أتناول بإستحقاق جسدك و دمك\nالثمين مدّة حياتي و في ساعة موتي حتى يكونا لنفسي\nالدواء و التعزية.. آمين الصلاة التاسعة: مرة أبانا و السلام\nيا يسوع الفضيلة الملكية و سعادة النفس تذكر الألم الذي\nعانيته عندما كنت غارقاً في المرارة عند إقتراب الموت مهاناً\nو مذلولاً من البشر ومعتقداً إن أباك تخلى عنك صرخت\n(إلهي إلهي لماذا تركتني) بحق هذه الشدة أتوسل إليك يا\nمخلصي لاتدعني متروكاً في الشدائد وعذابات الموت.. آمين الصلاة العاشرة:\nمرة أبانا و السلام يا يسوع يا من أنت لكل\nشيئ البداية و النهاية الحياة والفضيلة إنك لأجلنا غرقت في\nلجة الآلام من قمة الرأس حتىأخمص القدمين و إكراماً لعظيم\nجراحاتك علمني أن أحفظ وصايك بمحبة حقيقية هذه الوصايا التي\nطريقها رحب و سهل للذين يحبونك… آمين الصلاة الحادية عشر:\nمرة أبانا و السلام يا يسوع يا لجة الرحمة الكثيرة\nالعمق أتوسل إليك بحق ذكرى جراحاتك التي إخترقت صلب عظامك\nو أحشائك أن تنتشلني من الخطيئة أنا الشقي الغارق في\nذنوبي و أن تخفيني عن وجهك الغاضب في ثقوب جراحاتك\nحتى يمر غضبك و سخطك العادل….آمين الصلاة الثانية عشر: مرة\nأبانا والسلام يا يسوع مرآة الحقيقة علامة الوحدة رباط المحبة\nتذكر جراحاتك الجمة التي ابتليت بها من الرأس الى القدم\nو ممزقاً و مضرجاً بدمك المعبود.. أي وجع كبير و\nهائل إحتملته من أجلنا في جسدك الطاهر… يا يسوع الحلو\nللغاية ما كان يمكن أن تصنعه وما صنعته؟ أتوسل إليك\nيا مخلصي أن تطبع بدمك الكريم كل جروحك في قلبي\nحتى بدون توقف أقرأ دائماً الامك و حبك وتذكاراً وفياً\nلعذابك لتتجدد في قلبي ثمرة الآمك و ليزدد حبك كل\nيوم في قلبي حتى أبلغ إليك أنت الذي هو كنز\nكل الخيرات و كل الأفراح التي أتوسل إليك أن تهبني\nإياها يا يسوع الكثير الحلاوة في الحياة الأبدية.. آمين الصلاة\nالثالثة عشر: مرة أبانا والسلام يا يسوع الليث الشديد البأس\nالملك الغير المائت و الذي لا يقهر تذكر الآلام التي\nعصفت بك عندما تلاشت كل قواك الجسدية و القلبية فأحنيت\nرأسك قائلاً (كل شيئ قد تم) إكراماً لهذا الضيق و\nالألم أتوسل إليك يا سيدي المحبوب أن تترأف بي في\nآخر ساعة من حياتي عندما تكون روحي في النزاع و\nنفسي في إضطراب… آمين الصلاة الرابعة عشر: مرة أبانا و\nالسلام يا يسوع الإبن الوحيد للآب ضياء و صورة جوهره\nتذكر التو صية الخاشعة التي رفعتها الى أبيك قائلاً (يا\nأبت بين يديك أستودع روحي) ثم جسدك ممزق قلبك محطم\nأحشاء رحمتك مفتوحة لإفتدائنا أسلمت روحك. أتوسل إليك يا ملك\nالقديسين أن تقويني و تغيثني لأقاوم الشيطان و الجسد والعالم\nحتى إذا مت عن العالم أحيا لك وحدك.. إقبل أرجوك\nعند ساعة موتي نفسي العائدة إليك. الصلاة الخامسة عشر: مرة\nأبانا و السلام يا يسوع الكرمة الحقيقية الخصبة تذكر دمك\nالفياض الذي سكبته بغزارة مثل العنب من تحت المعصرة ومن\nجنبك الذي طعنه الجندي بضربة حربة قد أعطيت الدم والماء\nحتى لم يبق و لاقطرة واحدة وكرزمة بخور متصاعد من\nاعلى الصليب جسدك اللطيف تلاشى و جفت عُصارة أحشائك و\nصُلب عظامك يبست. إكراماً لمرارة هذا العذاب أتوسل إليك يا\nيسوع الحنون أن تتقبل روحي عندما أكون في النزاع…. آمين\nصلاة: يا يسوع الحنون إجرح قلبي حتى ليلاً و نهاراً\nتكون لي خبزاً دموع التكفير و الألم والحب إهدني كلياً\nإليك و ليكن لك قلبي السكن الدائم و أن يكون\nسلوكي مرضياً أمامك وأن تكون حياتي تمجيداً لك حتى أستحق\nبعد موتي فردوسك و أمجدك الى الأبد مع جميع قديسيك…\nآمين"
    },
    "13": {
        "title": "ظهر القديس يوسف البتول على القديسة فوستينا رسولة الرحمة الإلهيّة وطلب منها أن تخصّه بإكرامٍ متواصل، بتلاوة هذه الصلاة التي أعطاها إياها",

    "14": {

        "image": "14.jpg",
        "content": "اللهمّ أصغِ إلى معونتي. يا رب أسرع إلى إغاثتي. المجد\nللآب… السرّ الأوّل: إنّ الدم الثمين الذي أهرقه لأوّل مرّة\nفادينا الحبيب، كان في اليوم الثامن بعد ميلاده، حين اختتن\nتكميلاً للشريعة الموسويّة. إنّ يسوع صنع ذلك ليفي للعدل الإلهيّ\nعن زلاّتنا، لنحرّك فينا شواعرَ التوجّع على ذنوبنا، ولنعِد السيّد\nالمسيح بأن نعيش بنعمته الإلهيّة من الآن وصاعدًا بالطهارة روحًا\nوجسمًا. آمين. (5 مرّات أبانا ومرّة المجد) نسألك يا ربّ\nأن تُشفق على عبيدك الذين افتديتهم بدمك الكريم. السر الثاني:\nإنّ يسوع أهرق بغزارة دمه في بستان الزيتون، حتّى أنّ\nالأرض ابتلّت منه، وذلك لنظره الخيانة العظيمة التي سيعامله بها\nالبشر عن حبّه المفرط لهم. أوَّاه! لنندم إذًا على المعاملة\nالسيئة التي كافأنا بها إحساناته العديدة، ونقصد أن نستفيد من\nنعمه وإلهاماته المقدّسة. آمين. (5 مرّات أبانا ومرّة المجد) نسألك\nيا ربّ أن تُشفق على عبيدك الذين افتديتهم بدمك الكريم.\nالسرّ الثالث: إنّ السيّد المسيح، أهرق دمه في جَلده الأليم،\nبنوع أنّ هذا الدم الثمين كان يتفجّر من جسمه الكريم\nومن أعضائه بغزارة. فكان يقدّم ذلك إلى أبيه الأزليّ، وفاء\nعن عدم صبرنا وعن تفاهتنا. فلماذا لا نزجر فينا ثورة\nالغضب، ونكبح حبّ الذات، لنجتهد أن نعتصم في المستقبل بالصبر\nفي المحن وفي استصغار أنفسنا، فنقتبل بسكون الإهانات التي تواجهنا.\nآمين. (5 مرّات أبانا ومرّة المجد) نسألك يا ربّ أن\nتُشفق على عبيدك الذين افتديتهم بدمك الكريم. السرّ الرابع: إنّ\nالدم سال بوفرةٍ من هامة يسوع، لمّا تكلّل بالشوك قصاصًا\nعن كبريائنا وأفكارنا الشريرة. وأمّا نحن فلم نزل نلازم ونرعى\nفينا روح الكبرياء والعجرفة، ونزرع في أفكارنا التطوّرات الدَنِسة والتخيّلات\nالقبيحة. لنتمعَّنْ إذًا فيما بعد، ونتصوّر دائمًا فناءنا الحقيقيّ، وشقاءنا،\nوضعفنا، لنقاوم بصدق وثبات جميع هجمات الشيطان الأثيمة. آمين. (5\nمرّات أبانا ومرّة المجد) نسألك يا ربّ أن تُشفق على\nعبيدك الذين افتديتهم بدمك الكريم. السرّ الخامس: أوَّاه! كم من\nالدم فاض من عروق يسوع المحبوب، في سَيْره إلى جبل\nالجلجلة وهو مُثْقَل بالصليب، حتّى أنّ الشوارع التي اجتازها في\nأورشليم تلطّخت بهذا الدم الثمين، وكلّ ذلك وفاء عن الشكوك\nوالأمثلة الرديئة التي تجذب القريب، وتحمله على الذهاب في طريق\nالهلاك. آه! يا ترى، ألم نكن نحن من جملة هؤلاء\nالتُعَساء. مَن يعلم كم وكم من الأنفس قد زُجَّت في\nجهنّم بسبب أمثالنا الرديئة لنُصْلِحْ ذلك، ولنبذل جُهدنا، ونسعى لخلاص\nالنفوس بواسطة نصائحنا وإرشاداتنا التقويّة وأمثالنا الصالحة، آمين. (5 مرّات\nأبانا ومرّة المجد) نسألك يا ربّ أن تُشفق على عبيدك\nالذين افتديتهم بدمك الكريم. السرّ السادس: إنّ المخلّص سفك دمه\nبأوفر غزارة في صَلْبه الأليم، عندما تدفّق من عروق جسمه\nالمهشَّم وشرايينه الممزَّقة مثل ينبوع من يديه ورجليه، ذاك الدم\nبلسم الحياة الأبديّة غفرانًا عن جرائم العالم وآثامه. هل يوجد\nبعد مَن يريد أن يداوم على ارتكاب الخطيئة ويجدّد بذلك\nصَلْب ابن الله الوحيد؟ لِنبكِ إذًا بمرارة نقائصنا، ونكفّر عنها\nأمام خادم السرّ المقدّس، ولنبتدئ منذ الآن سيرة مسيحيّة صالحة،\nمصوّرين أمام أعيننا عِظَم مقدار الدم الكريم الذي أهرقه يسوع\nالمسيح لخلاصنا الأبديّ. (5 مرّات أبانا ومرّة المجد) نسألك يا\nربّ أن تُشفق على عبيدك الذين افتديتهم بدمك الكريم. السرّ\nالسابع: أخيرًا، أَهرقَ يسوع دمه بعد موته، حينما اخترقت الحربة\nجنبه، وجرحت قلبه المحِبّ. فخرج منه إذّاك دم وماء، ليبرهن\nلنا أنّه قد أهرق دمه كلّه حتّى آخر نقطة لأجل\nخلاصنا. فيا لها من رأفة وحبّ متناهيين، رأفة مخلّصنا الحبيب\nالذي تفانى في سبيل خلاصنا. وبما أنّنا عاجزون عن تقديم\nالشكر لفادينا المحبوب، لنَدْعُ إذن جميع القدّيسين والملائكة، ونستغيث بوالدتنا\nالطاهرة مريم العذراء ليسبّحوا ويمجّدوا عنّا دمك الثمين هاتفين: ليحيَ\nدم يسوع المبارَك، الآن وكلّ أوان وإلى دهر الداهرين. آمين.\n(5 مرّات أبانا ومرّة المجد) نسألك يا ربّ أن تُشفق\nعلى عبيدك الذين افتديتهم بدمك الكريم. صلاة: أيّها الدم الثمين\nللحياة الأبديّة، أنت الذي تحامي دائمًا عن قضيّة البشر أمام\nعرش القدير الرحوم الغفور؛ إنّي أسجد لك وأعبدك بكلّ احترام،\nوأرغب بكلّ قواي أن أعوّض عن الإهانات والشتائم التي تَلْحَق\nبك من البشر، وخاصّة من الذين يجرؤون على التجديف عليك.\nيا ترى! من لا يبارك هذا الدم اللامتناهي في القيمة،\nومن لا يلتهب حبًّا بيسوع الذي أهرق دمه لأجلنا؟ فماذا\nكان حلّ بي لو لم أُفتَدَ بهذا الدم الإلهي، ومَن\nالذي ساقه إلى سفكه لآخر نقطة من عروقه إلاّ محبّته\nالغير المتناهية؟ فيا أيّتها المحبّة المقدَّسة، أنتِ التي مَنَحْتِنا هذا\nالبَلْسَم الخلاصيّ، ويا أيها البلْسَم الثمين المنبعث من ينبوع المحبّة\nالفائقة، إجعل القلوب والألسن تبارككَ وتمجّدكَ وتشكركَ، الآن وعلى الدوام\nوإلى أبد الآبدين. آمين. لقد افتديتنا يا ربّ بدمك الكريم\nوجعلْتنا مُلْكًا لإلهنا."

    "15": {
        "title": "Adoro Te Devote",
        "lang": "en",
        "image": "15.jpg",
        "content": "Adoro Te Devote I adore you devoutly, Godhead unseen, who\ntruly lies hidden under these sacramental forms. My soul surrenders\nitself to you without reserve, for in contemplating you it\nis completely overwhelmed. Sight, touch, and taste are no guide\nin finding you, and only hearing is a sure guide\nfor our faith. I believe everything that the Son of\nGod has said, and nothing can be truer than this\nWord of the truth. Only the Godhead was hidden on\nthe Cross, but here the humanity is hidden as well.\nYet I believe and acknowledge them both and make the\nsame request as did the repentant thief. I do not\nsee the marks of the wounds, as Thomas did, and\nyet I, too, own you as “My God.” Grant that\nI believe in you more and more, that I put\nmy hope in you and that I love you. Living\nBread, that ever recalls the Lord’s death and gives life\nto his servants, grant to my soul to live by\nyou and always to taste your sweetness. Lord Jesus, loving\nPelican of heaven,1 cleanse me, a sinner, with your Blood;\nfor a single drop can save the whole world from\nall its sin. Jesus, as I look on your veiled\npresence, I pray that what I long for so ardently\nmay come about, and that I may see your face\nunveiled and be happy in the vision of your glory.\n—Attributed to St. Thomas Aquinas (1225-1274) Prayer taken from Catholic\nHousehold Blessings and Prayers, Revised Edition, copyright © 2007, United\nStates Conference of Catholic Bishops, Washington, DC. All rights reserved.\n1 The pelican is an ancient symbol of the eucharistic\nLord. It was believed that in times of want, a\nmother pelican would feed her children with her own blood."

        "content": "*مسبحة + طلبة + تكريس* دم يسوع الثمين *مسبحة دم\nيسوع الثمين* هذه العبادة تكمن بتلاوة ٣٣ مرّة الأبانا تذكاراً\nل ٣٣ سنة التي عاشها الرّب يسوع على الأرض. خلال\nهذه الصلاة نتأمّل في الظروف السبعة الرئيسيّة حيث أعطانا الرّب\nالإله كلّ دمه محبّة بنا ولخلاصنا. 🙏🏻 نرسم إشارة الصليب\nمردّدين : - يا ربّ هلمّ إلى معونتي - يا\nربّ أسرع إلى إغاثتي. - المجد للآب والإبن والروح القدس\n*السرّ الأول : ختانة يسوع* أيّها الطفل يسوع، بحقّ دمك\nالمسفوك لخلاصنا، أكشف لنا أهميّة هبة الحياة الثمينة وعلّمنا أن\nنعيشها بظل نور إسمك وفرح نعمتك. آمين *٥ مرّات الأبانا\nومرّة المجد* *السرّ الثاني : النزاع* يا ابن اللّه، ليجعلنا\nعرَقَك الدموي في بستان الزيتون، أن نعي رهبة الخطيئة التي\nهي السرّ الأكيد الذي يحرمنا حُبّك، ويحزن حياتنا. آمين *٥\nمرّات الأبانا ومرّة المجد* *السرّ الثالث : الجلد* أيّها المعلّم\nالإلهي، ليجعلنا دمك المسفوك خلال جلدك أن نحبّ الطهارة لنعيش\nصداقتك ونتأمّل بنظرة شفافة عظمة خليقتك. آمين *٥ مرّات الأبانا\nومرّة المجد* *السرّ الرابع : إكليل الشوك* يا ملك الكون،\nليُدمّر دم هامتك المقدّسة المكلّلة بالشوك أنانيتنا، وكبرياءنا، وليجعلنا ننمو\nبمحبّتك وخدمة إخوتنا المحتاجين. آمين *٥ مرّات الأبانا ومرّة المجد*\n*السرّ الخامس : حمل الصليب* يا مخلّص العالم، ليُنر دمك\nالمسفوك على طريق الجلجلة، حياتنا، وليساعدنا على حمل صليبنا وراءك\nوالتأمّل بآلامك. آمين *٥ مرّات الأبانا ومرّة المجد* *السرّ السادس\n: الصلب* يا حمل اللّه المذبوح لأجلنا، علّمنا مسامحة الإهانات\nومحبّة الأعداء. إكشف لنا قوّة دمك الثمين وغناه بواسطة مريم\nأُمّك وأُمّنا. آمين *٥ مرّات الأبانا ومرّة المجد* *السرّ السابع\n: الطعن بالحربة* يا قلب يسوع المطعون بالحربة لأجلنا، إقبل\nصلاتنا، أنظر إلى الفقراء، إلى دموع المتألّمين، إلى رجاء الشعوب،\nإجمع البشرية في ملكوتك : ملكوت السلام والحب والعدالة. آمين\n*٣ مرّات الأبانا ومرّة المجد* *طلبة دم يسوع الثمين* ~\nنكرّر بعد كلّ ابتهال *خلّصنا* يا دم المسيح، وحيد الآب\nيا دم المسيح، كلمة اللّه المتجسّد يا دم المسيح، الذي\nفي النّزاع سال على الأرض يا دم المسيح، الذي تفجّر\nمن جلد جسدك الطاهر وتتويجك بإكليل الشوك يا دم المسيح،\nالذي سُكِب على الصليب يا دم المسيح، ثمن خلاصنا يا\nدم المسيح، الذي من دونه لا غفران يا دم المسيح،\nفي الإفخارستيا شراب النفوس ومطهّرها يا دم المسيح، الظافر على\nالشياطين يا دم المسيح، قوة الشهداء يا دم المسيح، شجاعة\nالمعترفين يا دم المسيح، مُنبت العذارى يا دم المسيح، الحامي\nمن المخاطر يا دم المسيح، ملجأ المقهورين يا دم المسيح،\nمعزّي الحزانى يا دم المسيح، رجاء التائبين يا دم المسيح،\nمقوي المنازعين يا دم المسيح، سلام القلوب وعذوبتها يا دم\nالمسيح، عربون الحياة الأبديّة يا دم المسيح، محرّر النفوس من\nالمطهر يا دم المسيح، المستحقّ كلّ فخر ومجد (نتلو الأبانا\nوالسلام والمجد مرتين) *فعل التكريس لدم يسوع الثمين* أيّها المخلّص\nالرحوم، إنّي مدركٌ لعدم كفاءتي ومقدّرٌ سموّك، لهذا أنطرح أمام\nقدميك وأشكرُك لنعمتِك التي أبديتها لي في العديد من البراهين،\nأنا مخلوقك الناكر الجميل. أشكرُك خاصة لأنك خلّصتني بدمك الثمين\nمن سُلطة الشيطان المدمّرة. في حضرة أُمّي الحبيبة مريم، وملاكي\nالحارس والقديس شفيعي وجميع الأجواق السماويّة، أكرّس نفسي بملء إرادتي،\nوبقلب مخلص يا يسوع الحبيب، لدمك الثمين الذي به افتديت\nالعالم من الخطيئة، والموت والجحيم. إنّي أعدُك بمعونة نِعمتك، وبكلّ\nقواي، أن أُحبّك وأشجّعُ عبادة دمك الثمين الذي هو ثمن\nفدائنا، حتى يكون دمُك المعبود مُكرّماً ومُمجّداً من الجميع. بهذه\nالطريقة، أرغبُ بالتعويض عن عدم إخلاصي لدم حبّك الثمين، وبتقديم\nأعمالي إرضاء لك، وكفّارة عن انتهاكاتِ البشر العديدة للحُرُمات المقدّسة\nضدّ هذا الدم الثمين الذي افتداهم. آه ! كم كنتُ\nأودُّ لو لم أقترفْ خطاياي وفتوري وكلّ أفعال عدمِ الإحترام\nالتي اقترفتُها ضدّ جلال الدم الثمين والمقدّس ! يا يسوع\nالحبيب، إنّي أقدّم لك الحبّ والإكرام والسجود الذي قدّمتْه لدمِك\nالثمين أُمُّك الكليّة القداسة ورُسُلك المخلصين مع جميع القدّيسين. أسألُك\nأن تنسى خيانتي السابقة لك وفتوري وأن تسامحَ جميع الذين\nأساؤوا إليك. إنضحني أيّها الفادي الإلهي مع جميع البشر بدمك\nالثمين لكي نستطيعَ أن نحبَّك، يا أيّها الحبّ المصلوب، من\nالآن وصاعداً من كلّ قلبنا، وأن نكرّم بجدارةٍ ثمن فدائنا.\nآمين. - يا دم الحمل المذبوح : دافع عنّا في\nكلّ هجماتِ الشرير. - يا دم يسوع المسفوك على الصليب\n: طهّرنا واغسلنا واحمينا. - يا أيّها الدم الذي تدفّق\nمن قلب يسوع : نجّنا من كلّ شرّ. آمين"
    }

    const select = document.getElementById('prayerSelect');
    Object.keys(prayersDatabase).sort((a,b) => parseInt(a)-parseInt(b)).forEach(id => {
        let opt = document.createElement('option');
        opt.value = id;
        opt.textContent = prayersDatabase[id].title + " (ID: " + id + ")";
        select.appendChild(opt);
    });

    function showPrayer(id) {
        const displayBox = document.getElementById('prayerDisplay');
        const textDiv = document.getElementById('prayerText');
        const imgEl = document.getElementById('prayerImage');
        const imgWrap = document.getElementById('imageWrapper');

        if (!id || !prayersDatabase[id]) {
            displayBox.style.display = 'none';
            return;
        }

        const data = prayersDatabase[id];
        textDiv.style.direction = (data.lang === 'en') ? 'ltr' : 'rtl';
        textDiv.style.textAlign = (data.lang === 'en') ? 'left' : 'right';
        textDiv.textContent = data.content;

        if (data.image) {
            imgEl.src = "Photos/" + data.image;
            imgWrap.style.display = 'block';
            imgEl.onerror = function() { imgWrap.style.display = 'none'; };
        } else {
            imgWrap.style.display = 'none';
        }
        displayBox.style.display = 'block';
    }
</script>
